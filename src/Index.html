    function multiPicker(name,label,options,selected,listName){
      selected=selected||[];
      const checked=new Set(selected);
      return `<label>${esc(label)}</label><details class="multi-picker" data-multi="${attr(name)}"><summary><span class="multi-summary">Select ${esc(label.toLowerCase())}</span></summary><div class="multi-menu">
        <div class="multi-options">${(options||[]).map(o=>`<label class="multi-option"><input type="checkbox" value="${attr(o)}" ${checked.has(o)?'checked':''}> <span>${esc(o)}</span></label>`).join('')}</div>
        ${App.user.permissions.includes('vocabulary')?`<button type="button" class="button small multi-add" data-add-list="${attr(listName)}" data-target-multi="${attr(name)}">+ Add new term</button>`:''}
      </div></details>`;
    }

    function bindMultiPickers(){
      document.querySelectorAll('details.multi-picker').forEach(d=>{
        d.querySelectorAll('input[type="checkbox"]').forEach(c=>c.onchange=()=>updateMultiSummary(d.dataset.multi));
        updateMultiSummary(d.dataset.multi);
      });
      document.querySelectorAll('[data-add-list]').forEach(b=>b.onclick=async e=>{
        e.preventDefault();e.stopPropagation();
        const value=prompt('New '+b.dataset.addList+' term:');
        if(!value)return;
        try{
          const result=await gas('apiAddVocabularyTerm',b.dataset.addList,value);
          const name=b.dataset.targetMulti,details=document.querySelector(`details[data-multi="${name}"]`),container=details.querySelector('.multi-options');
          if(![...container.querySelectorAll('input')].some(x=>x.value===result.value)){
            const label=document.createElement('label');label.className='multi-option';
            label.innerHTML=`<input type="checkbox" value="${attr(result.value)}" checked> <span>${esc(result.value)}</span>`;
            container.appendChild(label);label.querySelector('input').onchange=()=>updateMultiSummary(name);
          }
          updateMultiSummary(name);refreshEnumFromResult(b.dataset.addList,result.values);
        }catch(err){toast(err.message,true)}
      });
    }

    function getMulti(name){return [...document.querySelectorAll(`details[data-multi="${name}"] input[type="checkbox"]:checked`)].map(x=>x.value)}
    function updateMultiSummary(name){
      const d=document.querySelector(`details[data-multi="${name}"]`);if(!d)return;
      const values=[...d.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);
      d.querySelector('.multi-summary').textContent=values.length?values.join(', '):'None selected';
    }

    async function addVocabularyTerm(listName,selectId){
      const value=prompt('New '+listName+':');if(!value)return;
      try{
        const result=await gas('apiAddVocabularyTerm',listName,value);
        const select=document.getElementById(selectId);
        if(![...select.options].some(o=>o.value===result.value)){
          const option=document.createElement('option');option.value=result.value;option.textContent=result.value;select.appendChild(option);
        }
        select.value=result.value;refreshEnumFromResult(listName,result.values);
      }catch(e){toast(e.message,true)}
    }

    function refreshEnumFromResult(listName,values){
      const map={Place:'place',Classification:'classification',Material:'material',Technique:'technique'};
      if(map[listName])App.enums[map[listName]]=values;
    }

    function measurementEditor(rows,legacy){
      const by={};(rows||[]).forEach(r=>by[r.MeasurementType]=r);
      const types=[['Weight','g'],['Length','mm'],['Width','mm'],['Thickness','mm'],['Diameter','mm']];
      return `<div class="measure-box"><div class="measurement-buttons">${types.map(([t,u])=>`<button type="button" class="button small add-measurement" data-type="${t}" data-unit="${u}">+ ${t.toLowerCase()} (${u})</button>`).join('')}</div><div id="measurementRows">${types.filter(([t])=>by[t]).map(([t,u])=>measurementRow(t,u,by[t].Value)).join('')}</div>${(!rows||!rows.length)&&legacy?`<div class="legacy-note">Legacy measurements: <strong>${esc(legacy)}</strong>. Add structured measurements above to replace the legacy display.</div>`:''}</div>`;
    }

    function measurementRow(type,unit,value=''){return `<div class="measurement-row" data-measure="${attr(type)}"><strong>${esc(type)}</strong><input type="number" min="0" step="any" value="${attr(value)}" placeholder="0"><span>${esc(unit)}</span><button type="button" class="remove-measurement" title="Remove">×</button></div>`}
    function bindMeasurementButtons(){
      document.querySelectorAll('.add-measurement').forEach(b=>b.onclick=()=>{
        if(document.querySelector(`[data-measure="${b.dataset.type}"]`))return toast(b.dataset.type+' is already present.',true);
        document.getElementById('measurementRows').insertAdjacentHTML('beforeend',measurementRow(b.dataset.type,b.dataset.unit,''));
        bindRemoveMeasurement();
      });
      bindRemoveMeasurement();
    }
    function bindRemoveMeasurement(){document.querySelectorAll('.remove-measurement').forEach(b=>b.onclick=()=>b.closest('.measurement-row').remove())}
    function getMeasurements(){
      return [...document.querySelectorAll('.measurement-row')].map(row=>{
        const type=row.dataset.measure,unit=type==='Weight'?'g':'mm',value=row.querySelector('input').value;
        if(value==='')return null;
        return {MeasurementType:type,Value:Number(value),Unit:unit,Notes:''};
      }).filter(Boolean);
    }
    function measurementDisplay(rows,legacy){
      if(rows&&rows.length)return rows.map(r=>`${r.MeasurementType}: ${r.Value} ${r.Unit}`).join('; ');
      return legacy||'';
    }

    async function accessionForm(existingData=null,recordId=null){
      if(!App.people.length)App.people=await gas('apiListPeopleOrgs',{});
      const a=existingData&&existingData.accession?existingData.accession:{};
      const isEdit=!!a.AccessionID;

      modal(isEdit?'Edit accession':(recordId?'Accession this record':'New accession'),
        `<div class="form-grid">
          ${field(['AccessionNumber','Accession number','text'],a.AccessionNumber||'')}
          ${field(['AccessionDate','Accession date','text'],a.AccessionDate||'')}
          ${field(['AcquisitionMethod','Acquisition method','select',App.enums.acquisitionMethod],a.AcquisitionMethod||'')}
          ${field(['SourcePartyID','Source person / organisation','select',[{value:'',label:'Not linked'}].concat(App.people.map(p=>({value:p.PartyID,label:p.PreferredName})))],a.SourcePartyID||'')}
          ${field(['DonorSourceDisplay','Source display text','text'],a.DonorSourceDisplay||'')}
          ${field(['AccessionSummary','Summary','textarea'],a.AccessionSummary||'')}
          ${field(['LegalDocumentStatus','Legal document status','select',App.enums.legalDocumentStatus],a.LegalDocumentStatus||'Not assessed')}
          ${field(['OwnershipStatus','Ownership status','select',App.enums.ownershipStatus],a.OwnershipStatus||'Unknown')}
          <div class="field full"><label>Accession documentation PDF</label><input id="accessionDocumentFile" type="file" accept="application/pdf,.pdf"><small>${a.LegalDocumentURL?'A PDF is already linked. Uploading another will replace the primary document link.':'Optional. Saved to the configured accession-document Shared Drive folder.'}</small></div>
          ${field(['DocumentationFolderURL','Documentation folder URL','text'],a.DocumentationFolderURL||'')}
          ${field(['RestrictionsConditions','Restrictions / conditions','textarea'],a.RestrictionsConditions||'')}
          ${field(['Notes','Notes','textarea'],a.Notes||'')}
        </div>`,
        `<button class="button" data-close>Cancel</button>${!isEdit&&recordId?'<button id="linkExistingAccession" class="button">Link existing accession</button>':''}<button id="saveAccession" class="button primary">${isEdit?'Save accession':recordId?'Create & assign accession':'Create accession'}</button>`);

      if(document.getElementById('linkExistingAccession'))document.getElementById('linkExistingAccession').onclick=()=>linkExistingAccessionForm(recordId);

      document.getElementById('saveAccession').onclick=async()=>{
        try{
          busy(true);
          const payload={
            AccessionNumber:val('AccessionNumber'),AccessionDate:val('AccessionDate'),AcquisitionMethod:val('AcquisitionMethod'),
            SourcePartyID:val('SourcePartyID'),DonorSourceDisplay:val('DonorSourceDisplay'),AccessionSummary:val('AccessionSummary'),
            LegalDocumentStatus:val('LegalDocumentStatus'),OwnershipStatus:val('OwnershipStatus'),
            DocumentationFolderURL:val('DocumentationFolderURL'),RestrictionsConditions:val('RestrictionsConditions'),Notes:val('Notes')
          };
          const file=document.getElementById('accessionDocumentFile').files[0];
          let doc=null;
          if(file){
            if(file.size>12*1024*1024)throw new Error('Accession PDF must be approximately 12 MB or smaller.');
            doc={fileName:file.name,mimeType:file.type||'application/pdf',base64:await toBase64(file)};
          }

          let out;
          if(isEdit)out=await gas('apiSaveAccession',a.AccessionID,payload,doc);
          else if(recordId)out=await gas('apiCreateAccessionForRecord',recordId,payload,doc);
          else out=await gas('apiCreateAccession',payload,doc);

          closeModal();toast(isEdit?'Accession saved.':'Accession created.');
          if(recordId)return openRecord(recordId,false);
          return openAccession(isEdit?a.AccessionID:out.accession.AccessionID,false);
        }catch(e){toast(e.message,true);busy(false)}
      };
    }

    function recordAccessionForm(d){
      if(d.record.AccessionID&&d.accession)return accessionForm({accession:d.accession},d.record.RecordID);
      return accessionForm(null,d.record.RecordID);

      App.futureExhibitMode=mode;
      App.view='futureExhibits';setNav('futureExhibits');closeMobileNav();loading();
      try{const type=mode==='temporary'?'Temporary':'Permanent';const rows=await gas('apiListExhibitions',type);App.exhibitions=rows;const controls=`<div class="subnav"><button class="${mode==='permanent'?'active':''}" id="permEx">Permanent Exhibits</button><button class="${mode==='temporary'?'active':''}" id="tempEx">Temporary Exhibits</button></div>`;html(`<div class="eyebrow">Curatorial planning</div><div class="page-title"><div><h1>Future Exhibit Planning</h1><p>${mode==='permanent'?'Plan object selections for the permanent galleries.':'Develop and compare temporary exhibition concepts.'}</p></div>${mode==='temporary'&&App.user.permissions.includes('exhibits')?'<button id="newTempExhibit" class="button primary">+ New temporary exhibit</button>':''}</div>${controls}<div class="exhibit-grid">${rows.length?rows.map(e=>`<button class="exhibit-card" data-exhibition="${attr(e.ExhibitionID)}"><span class="eyebrow">${esc(e.ExhibitionStatus||e.PlanningStatus||'Planning')}</span><span class="exhibit-title">${esc(e.ExhibitionTitle)}</span><span class="exhibit-count">${esc(e.ItemCount||0)}</span><span class="muted">object${Number(e.ItemCount)===1?'':'s'} assigned</span>${e.StartDate||e.EndDate?`<span class="tiny">${esc(e.StartDate||'')} ${e.EndDate?'– '+esc(e.EndDate):''}</span>`:''}</button>`).join(''):'<div class="empty">No exhibit plans.</div>'}</div>`);document.getElementById('permEx').onclick=()=>futureExhibitsPage('permanent');document.getElementById('tempEx').onclick=()=>futureExhibitsPage('temporary');if(document.getElementById('newTempExhibit'))document.getElementById('newTempExhibit').onclick=()=>temporaryExhibitionForm();setCurrentScreen({kind:'futureExhibits',mode});document.querySelectorAll('[data-exhibition]').forEach(b=>b.onclick=()=>openExhibition(b.dataset.exhibition));}catch(e){error(e)}
    }
    async function openExhibition(id,remember=true){if(remember)pushCurrentScreen();loading();try{const d=await gas('apiGetExhibition',id),e=d.exhibition;html(`<div class="eyebrow">${esc(e.ExhibitionType||'Exhibit')} exhibit plan</div><div class="page-title"><div><button class="button small" id="backExhibits">← Exhibit Planning</button><h1 style="margin-top:12px">${esc(e.ExhibitionTitle)}</h1><p>${esc(e.ExhibitionStatus||e.PlanningStatus||'Planning')} · ${d.items.length} assigned item${d.items.length===1?'':'s'}</p></div>${App.user.permissions.includes('exhibits')?'<div><button id="editExhibit" class="button">Edit plan</button> <button id="addExhibitItem" class="button primary">+ Add item</button></div>':''}</div>${e.Description?textCard('Planning description',e.Description):''}<div class="card"><div class="card-header"><h2>Selected collection &amp; archive material</h2></div><div class="card-body related-list">${d.items.length?d.items.map(i=>exhibitItemHtml(i)).join(''):'<div class="empty">No objects assigned yet. Use + Add item to start shortlisting.</div>'}</div></div>`);setCurrentScreen({kind:'exhibition',id});document.getElementById('backExhibits').onclick=goBack;if(document.getElementById('editExhibit'))document.getElementById('editExhibit').onclick=()=>exhibitionEditForm(e);if(document.getElementById('addExhibitItem'))document.getElementById('addExhibitItem').onclick=()=>addExhibitItemForm(d);document.querySelectorAll('[data-exhibit-record]').forEach(b=>b.onclick=()=>openRecord(b.dataset.exhibitRecord));document.querySelectorAll('[data-edit-exhibit-item]').forEach(b=>b.onclick=()=>{const item=d.items.find(x=>String(x.ExhibitionItemID)===String(b.dataset.editExhibitItem));if(item)editExhibitItemForm(d.exhibition,item);});document.querySelectorAll('[data-remove-exhibit-item]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this item from the exhibit plan? Historic installed items will be retained in exhibition history.')){try{const out=await gas('apiRemoveExhibitionItem',b.dataset.removeExhibitItem);toast('Exhibit assignment updated.');openExhibition(out.exhibition.ExhibitionID,false);}catch(err){toast(err.message,true)}}});}catch(e){error(e)}}
    function exhibitItemHtml(i){const r=i.Record||{};return `<div class="exhibit-item"><div><button class="record-link" data-exhibit-record="${attr(i.RecordID)}">${esc(r.PreferredTitle||i.RecordID)}</button><div class="tiny muted">${esc(r.RecordType||'')} · ${esc(r.CollectionArea||'')} · ${esc(r.DateDisplay||'')}</div>${i.InstalledDate?`<div class="tiny muted">Installed: ${esc(i.InstalledDate)}${i.DeinstalledDate?' · Deinstalled: '+esc(i.DeinstalledDate):''}</div>`:''}</div><div><span class="badge">${esc(i.SelectionStatus||'Candidate')}</span> <span class="badge">${esc(i.Priority||'Medium')}</span><div class="tiny">${esc(i.InterpretiveRole||'')}</div><div class="tiny">${esc(i.DisplayLocation||'')}</div></div>${App.user.permissions.includes('exhibits')?`<div><button class="button small" data-edit-exhibit-item="${attr(i.ExhibitionItemID)}">Edit</button> <button class="button small danger" data-remove-exhibit-item="${attr(i.ExhibitionItemID)}">Remove</button></div>`:''}</div>`}
    function temporaryExhibitionForm(){modal('New temporary exhibit',`<div class="form-grid">${field(['ExhibitionTitle','Title','text'],'')}${field(['ExhibitionStatus','Planning status','select',App.enums.exhibitionStatus],'Concept')}${field(['StartDate','Proposed opening date','text'],'')}${field(['EndDate','Proposed closing date','text'],'')}${field(['Curator','Curator / lead','text'],'')}${field(['Venue','Venue','text'],App.settings.defaultVenue||'')}${field(['Description','Planning description','textarea'],'')}${field(['Notes','Notes','textarea'],'')}</div>`,`<button class="button" data-close>Cancel</button><button id="saveTempEx" class="button primary">Create exhibit</button>`);document.getElementById('saveTempEx').onclick=async()=>{try{busy(true);const d=await gas('apiCreateTemporaryExhibition',{ExhibitionTitle:val('ExhibitionTitle'),ExhibitionStatus:val('ExhibitionStatus'),StartDate:val('StartDate'),EndDate:val('EndDate'),Curator:val('Curator'),Venue:val('Venue'),Description:val('Description'),Notes:val('Notes')});closeModal();toast('Temporary exhibit created.');openExhibition(d.exhibition.ExhibitionID,false);}catch(e){toast(e.message,true);busy(false)}};}
    function exhibitionEditForm(e){modal('Edit exhibit plan',`<div class="form-grid">${field(['ExhibitionTitle','Title','text'],e.ExhibitionTitle||'')}${field(['ExhibitionStatus','Planning status','select',App.enums.exhibitionStatus],e.ExhibitionStatus||e.PlanningStatus||'Planning')}${field(['StartDate','Start date','text'],e.StartDate||'')}${field(['EndDate','End date','text'],e.EndDate||'')}${field(['Curator','Curator / lead','text'],e.Curator||'')}${field(['Venue','Venue','text'],e.Venue||'')}${field(['Description','Planning description','textarea'],e.Description||'')}${field(['Notes','Notes','textarea'],e.Notes||'')}</div>`,`<button class="button" data-close>Cancel</button><button id="saveExhibitEdit" class="button primary">Save</button>`);document.getElementById('saveExhibitEdit').onclick=async()=>{try{busy(true);const d=await gas('apiUpdateExhibition',e.ExhibitionID,{ExhibitionTitle:val('ExhibitionTitle'),ExhibitionStatus:val('ExhibitionStatus'),StartDate:val('StartDate'),EndDate:val('EndDate'),Curator:val('Curator'),Venue:val('Venue'),Description:val('Description'),Notes:val('Notes')});closeModal();toast('Exhibit plan updated.');openExhibition(d.exhibition.ExhibitionID,false);}catch(err){toast(err.message,true);busy(false)}};}
    function addExhibitItemForm(d){modal('Add item to '+d.exhibition.ExhibitionTitle,`<div class="field"><label>Search the active collection / archives</label><input id="exhibitItemSearch" placeholder="Type a title, object type, ID, place…"></div><div id="exhibitSearchResults" style="margin-top:12px" class="empty">Enter a search term.</div>`,`<button class="button" data-close>Close</button>`);let timer;document.getElementById('exhibitItemSearch').oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(!q){document.getElementById('exhibitSearchResults').innerHTML='<div class="empty">Enter a search term.</div>';return;}timer=setTimeout(async()=>{try{const result=await gas('apiListRecords',{q,page:1,pageSize:25});const existing=new Set(d.items.map(i=>i.RecordID));document.getElementById('exhibitSearchResults').innerHTML=result.rows.filter(r=>!existing.has(r.RecordID)).map(r=>`<div class="candidate-row"><div><strong>${esc(r.PreferredTitle)}</strong><div class="tiny muted">${esc(r.RecordID)} · ${esc(r.CollectionArea)} · ${esc(r.DateDisplay)}</div></div><button class="button small" data-add-candidate="${attr(r.RecordID)}">Add</button></div>`).join('')||'<div class="empty">No available matches.</div>';document.querySelectorAll('[data-add-candidate]').forEach(b=>b.onclick=()=>exhibitCandidateOptions(d.exhibition.ExhibitionID,b.dataset.addCandidate));}catch(err){toast(err.message,true)}},250);};}
    function exhibitCandidateOptions(exhibitionId,recordId){modal('Add to exhibit plan',`<div class="form-grid">${field(['SelectionStatus','Selection status','select',App.enums.selectionStatus],'Candidate')}${field(['Priority','Priority','select',App.enums.exhibitPriority],'Medium')}${field(['InterpretiveRole','Interpretive role','select',App.enums.interpretiveRole],'Supporting object')}${field(['DisplayLocation','Proposed section / case','text'],'')}${field(['PlanningNotes','Planning notes','textarea'],'')}</div>`,`<button class="button" data-close>Cancel</button><button id="saveExhibitItem" class="button primary">Add to plan</button>`);document.getElementById('saveExhibitItem').onclick=async()=>{try{busy(true);const out=await gas('apiAddExhibitionItem',{ExhibitionID:exhibitionId,RecordID:recordId,SelectionStatus:val('SelectionStatus'),Priority:val('Priority'),InterpretiveRole:val('InterpretiveRole'),DisplayLocation:val('DisplayLocation'),PlanningNotes:val('PlanningNotes')});closeModal();toast('Added to exhibit plan.');openExhibition(out.exhibition.ExhibitionID,false);}catch(e){toast(e.message,true);busy(false)}};}
    function editExhibitItemForm(exhibition,item){modal('Edit exhibit assignment',`<div class="form-grid">${field(['SelectionStatus','Selection status','select',App.enums.selectionStatus],item.SelectionStatus||'Candidate')}${field(['Priority','Priority','select',App.enums.exhibitPriority],item.Priority||'Medium')}${field(['InterpretiveRole','Interpretive role','select',App.enums.interpretiveRole],item.InterpretiveRole||'Supporting object')}${field(['DisplayLocation','Section / case / display location','text'],item.DisplayLocation||'')}${field(['InstalledDate','Installed date','text'],item.InstalledDate||'')}${field(['DeinstalledDate','Deinstalled date','text'],item.DeinstalledDate||'')}${field(['PlanningNotes','Planning notes','textarea'],item.PlanningNotes||'')}${field(['Notes','Historic / installation notes','textarea'],item.Notes||'')}</div><div class="legacy-note">Setting Selection Status to <strong>Installed</strong> makes this a current display assignment while the exhibit itself is also marked Installed. Closing/archiving the exhibit preserves the assignment as exhibition history.</div>`,`<button class="button" data-close>Cancel</button><button id="saveExhibitAssignment" class="button primary">Save assignment</button>`);document.getElementById('saveExhibitAssignment').onclick=async()=>{try{busy(true);const out=await gas('apiUpdateExhibitionItem',item.ExhibitionItemID,{SelectionStatus:val('SelectionStatus'),Priority:val('Priority'),InterpretiveRole:val('InterpretiveRole'),DisplayLocation:val('DisplayLocation'),InstalledDate:val('InstalledDate'),DeinstalledDate:val('DeinstalledDate'),PlanningNotes:val('PlanningNotes'),Notes:val('Notes')});closeModal();toast('Exhibit assignment saved.');openExhibition(out.exhibition.ExhibitionID,false);}catch(e){toast(e.message,true);busy(false)}};}


    async function moveForm(r){
      if(!App.locations.length)App.locations=await gas('apiListLocations');
      modal('Move '+(r.PreferredTitle||r.RecordID),`<div class="form-grid">
        ${field(['ToLocationID','New location','select',App.locations.map(x=>({value:x.LocationID,label:x.LocationName||x.LocationID}))],'')}
        ${field(['MovementType','Movement type','select',['Relocation','Exhibition','Loan','Photography','Research','Conservation','Temporary location','Return','Other']],'Relocation')}
        ${field(['Reason','Reason','textarea'],'')}</div>`,
        `<button class="button" data-close>Cancel</button><button class="button primary" id="go">Record movement</button>`);
      document.getElementById('go').onclick=async()=>{
        try{busy(true);const d=await gas('apiMoveRecord',{RecordID:r.RecordID,ToLocationID:val('ToLocationID'),MovementType:val('MovementType'),Reason:val('Reason')});closeModal();toast('Movement recorded.');openRecord(d.record.RecordID,false);}catch(e){toast(e.message,true);busy(false)}
      };
    }

    function reviewForm(r){
      modal('Add review',`<div class="form-grid">
        ${field(['ReviewType','Review type','select',App.enums.reviewType],'Catalogue review')}
        ${field(['CatalogueStatusAfter','Catalogue status after review','select',App.enums.catalogueStatus],r.CatalogueStatus||'')}
        ${field(['Outcome','Outcome','text'],'')}${field(['Notes','Notes','textarea'],'')}</div>`,
        `<button class="button" data-close>Cancel</button><button class="button primary" id="go">Add review</button>`);
      document.getElementById('go').onclick=async()=>{
        try{busy(true);const d=await gas('apiAddReview',{RecordID:r.RecordID,ReviewType:val('ReviewType'),CatalogueStatusAfter:val('CatalogueStatusAfter'),Outcome:val('Outcome'),Notes:val('Notes')});closeModal();toast('Review added.');openRecord(d.record.RecordID,false);}catch(e){toast(e.message,true);busy(false)}
      };
    }

    function mediaForm(r){
      modal('Add media',`<div class="form-grid">
        <div class="field full"><label>File</label><input id="mediaFile" type="file"><small>Files are saved to the configured media folder in Google Drive or a Shared Drive.</small></div>
        ${field(['ViewDescription','View / description','text'],'')}
        ${field(['RightsStatement','Rights / credit statement','textarea'],'')}
        ${field(['PublicAccessStatus','Public access','select',App.enums.publicAccessStatus],'Internal only')}
        <div class="field"><label><input id="primary" style="width:auto" type="checkbox"> Set as primary media</label></div></div>`,
        `<button class="button" data-close>Cancel</button><button class="button primary" id="go">Upload</button>`);
      document.getElementById('go').onclick=async()=>{
        const f=document.getElementById('mediaFile').files[0];if(!f)return toast('Choose a file.',true);
        if(f.size>8*1024*1024)return toast('The browser uploader accepts files up to about 8 MB.',true);
        try{busy(true);const d=await gas('apiUploadMedia',{RecordID:r.RecordID,fileName:f.name,mimeType:f.type,base64:await toBase64(f),ViewDescription:val('ViewDescription'),RightsStatement:val('RightsStatement'),PublicAccessStatus:val('PublicAccessStatus'),IsPrimary:document.getElementById('primary').checked});closeModal();toast('Media uploaded.');openRecord(d.record.RecordID,false);}catch(e){toast(e.message,true);busy(false)}
      };
    }

    async function locationForm(){
      if(!App.locations.length)App.locations=await gas('apiListLocations');
      modal('New location',`<div class="form-grid">
        ${field(['LocationName','Location name','text'],'')}${field(['LocationType','Location type','select',App.enums.locationType],'Other')}
        ${field(['ParentLocationID','Parent location','select',[{value:'',label:'No parent / root'}].concat(App.locations.map(x=>({value:x.LocationID,label:x.LocationName||x.LocationID})))],'')}
        ${field(['ShortCode','Short code','text'],'')}${field(['Description','Description','textarea'],'')}${field(['Notes','Notes','textarea'],'')}</div>`,
        `<button class="button" data-close>Cancel</button><button class="button primary" id="go">Create location</button>`);
      document.getElementById('go').onclick=async()=>{
        try{busy(true);await gas('apiCreateLocation',{LocationName:val('LocationName'),LocationType:val('LocationType'),ParentLocationID:val('ParentLocationID'),ShortCode:val('ShortCode'),Description:val('Description'),Notes:val('Notes')});closeModal();toast('Location created.');App.locations=[];locations();}catch(e){toast(e.message,true);busy(false)}
      };
    }

    async function loadOverviewCarousel(){
      const host=document.getElementById('overviewCarousel'); if(!host)return;
      try{
        const rows=await gas('apiGetOverviewMedia',6);
        if(!rows||!rows.length){host.style.display='none';return;}
        loadOverviewCarousel.imageCache=loadOverviewCarousel.imageCache||{};
        const cache=loadOverviewCarousel.imageCache;
        const missing=[...new Set(rows.map(r=>String(r.DriveFileID||'')).filter(id=>id&&!cache[id]))];
        if(missing.length)Object.assign(cache,await gas('apiGetCarouselImages',missing,2200)||{});
        const usable=rows.filter(r=>cache[r.DriveFileID]);
        if(!usable.length){host.style.display='none';return;}
        host.style.display='';
        host.innerHTML=`<div class="carousel-stage">${usable.map((m,i)=>`<button type="button" class="carousel-slide ${i===0?'active':''}" data-carousel-record="${attr(m.RecordID)}" aria-label="Open ${attr(m.PreferredTitle)}"><img src="${attr(cache[m.DriveFileID])}" alt="${attr(m.ViewDescription||m.PreferredTitle||'Collection object')}" decoding="async"><div class="carousel-overlay"><div class="carousel-title">${esc(m.PreferredTitle)}</div><div class="carousel-caption">${esc([m.CollectionArea,m.DateDisplay,m.ViewDescription].filter(Boolean).join(' · '))}</div></div></button>`).join('')}</div><div class="carousel-controls"><button type="button" id="carouselPrev" aria-label="Previous image">‹</button><button type="button" id="carouselNext" aria-label="Next image">›</button></div>`;
        let index=0; const slides=[...host.querySelectorAll('.carousel-slide')];
        const show=n=>{if(!slides.length)return;slides[index].classList.remove('active');index=(n+slides.length)%slides.length;slides[index].classList.add('active');};
        host.querySelector('#carouselPrev').onclick=e=>{e.stopPropagation();show(index-1)};
        host.querySelector('#carouselNext').onclick=e=>{e.stopPropagation();show(index+1)};
        slides.forEach(s=>s.onclick=()=>openRecord(s.dataset.carouselRecord));
        if(App.carouselTimer)clearInterval(App.carouselTimer);
        App.carouselTimer=setInterval(()=>{if(document.getElementById('overviewCarousel'))show(index+1);else clearInterval(App.carouselTimer)},7000);
      }catch(e){console.error('Overview carousel failed:',e);host.style.display='none';}
    }

    function modal(title,body,footer){
      document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-header"><h2>${esc(title)}</h2><button class="button small" data-close>Close</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`;
      document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);
    }
    function closeModal(){document.getElementById('modalRoot').innerHTML=''}
    function busy(v){document.querySelectorAll('#modalRoot button,#modalRoot input,#modalRoot select,#modalRoot textarea').forEach(x=>x.disabled=v)}
    function val(n){return document.getElementById('f_'+n).value}

    function field(d,v){
      const [n,l,t,opts]=d,id='f_'+n,full=t==='textarea'?' full':'';
      if(t==='textarea')return `<div class="field${full}"><label for="${id}">${esc(l)}</label><textarea id="${id}">${esc(v||'')}</textarea></div>`;
      if(t==='select'){
        const o=(opts||[]).map(x=>typeof x==='object'?x:{value:x,label:x});
        return `<div class="field"><label for="${id}">${esc(l)}</label>${selectHtml(id,o,v,'Select')}</div>`;
      }
      return `<div class="field"><label for="${id}">${esc(l)}</label><input id="${id}" value="${attr(v||'')}"></div>`;
    }

    function datalistField(name,label,options,value,help){
      const id='f_'+name,listId='dl_'+name;
      return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" list="${listId}" value="${attr(value||'')}"><datalist id="${listId}">${(options||[]).map(x=>`<option value="${attr(x)}"></option>`).join('')}</datalist>${help?`<small>${esc(help)}</small>`:''}</div>`;
    }

    function selectHtml(id,opts,v,blankLabel='Select'){
      const o=(opts||[]).map(x=>typeof x==='object'?x:{value:x,label:x});
      const hasLegacy=v&&!o.some(x=>String(x.value)===String(v));
      return `<select id="${id}"><option value="">${esc(blankLabel)}</option>${hasLegacy?`<option value="${attr(v)}" selected>${esc(v)} (legacy)</option>`:''}${o.map(x=>`<option value="${attr(x.value)}" ${String(x.value)===String(v)?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
    }

    function def(l,v){return v?`<dt>${esc(l)}</dt><dd>${nl(v)}</dd>`:''}
    function textCard(t,v){return v?`<div class="card"><div class="card-header"><h2>${esc(t)}</h2></div><div class="card-body">${nl(v)}</div></div>`:''}
    function splitTerms(v){return String(v||'').split(' | ').map(x=>x.trim()).filter(Boolean)}
    function loading(){html('<div class="loading-card">Loading…</div>')}
    function error(e){html(`<div class="error-card"><strong>Something went wrong.</strong><div>${esc(e.message||String(e))}</div></div>`)}
    function fatal(e){error(e)}
    function html(x){document.getElementById('content').innerHTML=x}
    function toast(m,bad=false){document.getElementById('toastRoot').innerHTML=`<div class="toast ${bad?'error':''}">${esc(m)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3500)}
    function nl(v){return esc(v||'').replace(/\n/g,'<br>')}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function attr(v){return esc(v)}
    function toBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
  </script>
</body>
</html>
