<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --red:#c8102e;
      --red-dark:#8d0d22;
      --ink:#202222;
      --cream:#f5efe6;
      --cream-2:#fbf8f2;
      --paper:#ffffff;
      --line:#ded6ca;
      --muted:#6d6b66;
      --shadow:0 10px 30px rgba(25,25,22,.07);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream-2)}
    button,input,select,textarea{font:inherit} button{cursor:pointer} a{color:var(--red-dark)}
    .site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .masthead{max-width:1320px;margin:auto;padding:12px 24px 9px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .identity{display:flex;align-items:center;gap:13px;min-width:250px}
    .museum-logo{width:48px;height:48px;object-fit:contain}.brand-mark{width:48px;height:48px;display:grid;place-items:center;background:var(--red);color:#fff;font-family:Georgia,serif;font-weight:800;font-size:18px;letter-spacing:.02em}
    .identity-title{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;line-height:1}
    .identity-subtitle{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--red);margin-top:4px}
    .header-tools{display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end}
    .global-search{width:min(480px,48vw);border:1px solid var(--line);background:var(--cream-2);border-radius:3px;padding:9px 11px}
    .button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:3px;font-weight:700}
    .button:hover{background:var(--cream)}
    .button.primary{background:var(--red);border-color:var(--red);color:#fff}
    .button.primary:hover{background:var(--red-dark)}
    .button.small{padding:6px 9px;font-size:13px}
    .main-nav{border-top:1px solid #eee7dd;background:#fff}
    .nav-inner{max-width:1320px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:26px;overflow:auto}
    .nav-item{border:0;border-bottom:3px solid transparent;background:transparent;padding:12px 0 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
    .nav-item:hover,.nav-item.active{color:var(--red);border-bottom-color:var(--red)}
    .content{max-width:1320px;margin:auto;padding:34px 24px 50px}.app-footer{max-width:1320px;margin:0 auto 28px;padding:0 24px;color:var(--muted);font-size:11px;text-align:center}
    .eyebrow{color:var(--red);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}
    .page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
    .page-title h1{font-family:Georgia,"Times New Roman",serif;margin:0;font-size:36px;font-weight:500;line-height:1.08}
    .page-title p{margin:7px 0 0;color:var(--muted)}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin:18px 0 28px}
    .kpi{background:var(--cream);border-left:3px solid var(--red);padding:18px}
    .kpi .number{font-family:Georgia,serif;font-size:35px;font-weight:700}
    .kpi .label{font-weight:800;margin-top:3px} .kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}
    .card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
    .card+.card{margin-top:18px}
    .card-header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .card-header h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}
    .card-body{padding:18px}
    .queue-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:12px}
    .queue-card{background:var(--cream);padding:19px;border-top:2px solid var(--red)}
    .queue-card h3{font-family:Georgia,serif;font-size:22px;font-weight:500;margin:0 0 5px}
    .queue-card .count{font-size:30px;font-weight:800}
    .subnav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .subnav button{border:1px solid var(--line);background:#fff;padding:8px 12px}
    .subnav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .filter-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:14px}
    .filter-grid .span-2{grid-column:span 2}
    input,select,textarea{width:100%;border:1px solid #cfc7ba;background:#fff;padding:10px 11px;border-radius:2px;color:var(--ink)}
    input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,16,46,.15);border-color:var(--red)}
    .field label{display:block;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
    .field small{display:block;color:var(--muted);margin-top:5px}
    .field.full{grid-column:1/-1} textarea{min-height:105px;resize:vertical}
    .table-wrap{overflow:auto;border:1px solid var(--line);background:#fff}
    table{width:100%;border-collapse:collapse}
    th{background:var(--cream);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px;border-bottom:1px solid var(--line)}
    td{padding:11px 10px;border-bottom:1px solid #eee8df;vertical-align:top}
    tbody tr:hover{background:#fdfaf5}
    .record-link{border:0;background:transparent;color:var(--red-dark);font-weight:800;padding:0;text-align:left}
    .badge{display:inline-block;padding:3px 7px;font-size:11px;font-weight:800;background:#eee;border-radius:999px}
    .badge.high{background:#f6dfe4;color:#8b1730} .badge.good{background:#dfefe3;color:#28583a} .badge.review{background:#fff0c6;color:#66520b}
    .muted{color:var(--muted)} .tiny{font-size:11px;margin-top:4px}
    .pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
    .detail-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}
    .definition-grid{display:grid;grid-template-columns:190px 1fr;border-top:1px solid var(--line)}
    .definition-grid dt,.definition-grid dd{margin:0;padding:10px 0;border-bottom:1px solid #eee8df}
    .definition-grid dt{font-weight:800;padding-right:14px}
    .section-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}
    .tab-button{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px}
    .tab-button.active{background:var(--red);color:#fff;border-color:var(--red)}
    .related-list{display:grid;gap:10px} .related-item{border:1px solid var(--line);padding:12px;background:#fff}
    .location-tree ul{list-style:none;padding-left:22px} .location-node{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .location-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:12px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,18,.62);display:grid;place-items:center;padding:20px;z-index:100}
    .modal{width:min(980px,97vw);max-height:94vh;overflow:auto;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.25)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--cream)}
    .modal-header h2{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0}
    .modal-body{padding:20px} .modal-footer{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:15px}
    .date-row{display:grid;grid-template-columns:190px 1fr 1fr;gap:10px;align-items:end}
    .legacy-note{background:#fff8e7;border-left:3px solid #cc9c20;padding:10px 12px;font-size:13px;margin-top:8px}
    details.multi-picker{border:1px solid #cfc7ba;background:#fff;position:relative}
    details.multi-picker summary{list-style:none;padding:10px 11px;cursor:pointer;min-height:42px}
    details.multi-picker summary::-webkit-details-marker{display:none}
    .multi-menu{padding:8px 10px 10px;border-top:1px solid var(--line);max-height:230px;overflow:auto}
    .multi-option{display:flex;gap:8px;align-items:center;padding:4px 0} .multi-option input{width:auto}
    .multi-add{margin-top:7px}
    .measure-box{border:1px solid var(--line);background:var(--cream);padding:13px}
    .measurement-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
    .measurement-row{display:grid;grid-template-columns:150px 1fr 70px 42px;gap:8px;align-items:center;margin-top:7px}
    .remove-measurement{border:0;background:#fff;color:var(--red);font-weight:900}
    .loading-card,.error-card{background:#fff;border:1px solid var(--line);padding:22px} .error-card{border-color:#d5a6af;color:#7c1527}
    .empty{padding:28px;text-align:center;color:var(--muted)}
    .toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 15px;z-index:200} .toast.error{background:var(--red-dark)}
    .mobile-menu{display:none}
    .app-hidden{display:none!important}
    .analysis-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.analysis-card-head .badge{margin-left:6px}.analysis-summary{display:grid;grid-template-columns:170px 1fr;margin:12px 0 0;border-top:1px solid var(--line)}.analysis-summary dt,.analysis-summary dd{margin:0;padding:7px 0;border-bottom:1px solid #eee8df}.analysis-summary dt{font-weight:800;padding-right:10px}.analysis-guidance{font-size:12px;background:var(--cream);padding:9px;margin-top:10px;color:var(--muted)}.inline-add{display:flex;gap:8px;align-items:center;margin-top:10px}.setup-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.setup-section{margin-top:18px}.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:14px}.setup-list{display:grid;gap:8px}.setup-row{border:1px solid var(--line);padding:12px;background:#fff}.setup-banner{border:1px solid #d8b964;background:#fff8df;padding:14px 16px;margin:0 0 18px}.help-callout{background:#f3f0ea;border-left:3px solid var(--red);padding:12px 14px;margin-bottom:16px}

    /* Mobile interaction and layout */
    .nav-toggle{display:none;border:1px solid var(--line);background:#fff;padding:9px 12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
    .table-wrap{-webkit-overflow-scrolling:touch}
    button,.nav-item,.tab-button{touch-action:manipulation}

    @media(max-width:1100px), (hover:none) and (pointer:coarse){
      html,body{overflow-x:hidden}
      .site-header{position:sticky;top:0}
      .masthead{display:grid;grid-template-columns:1fr auto;gap:10px 12px;padding:10px 14px}
      .identity{min-width:0}
      .identity-title{font-size:19px;line-height:1.05}
      .identity-subtitle{font-size:9px;letter-spacing:.1em}
      .museum-logo{width:42px;height:42px}
      .nav-toggle{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:44px}
      .header-tools{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%;gap:8px}
      .global-search{width:100%;min-width:0;font-size:16px;min-height:44px}
      #newRecordButton{min-height:44px;white-space:nowrap}

      .main-nav{display:none;border-top:1px solid var(--line);box-shadow:0 12px 18px rgba(0,0,0,.06)}
      .main-nav.open{display:block}
      .nav-inner{display:grid;grid-template-columns:1fr;padding:6px 14px 12px;gap:0}
      .nav-item{text-align:left;padding:13px 4px;border-bottom:1px solid #eee7dd;min-height:44px}
      .nav-item.active{border-bottom-color:var(--red)}

      .content{padding:22px 14px calc(70px + env(safe-area-inset-bottom))}
      .page-title{display:grid;grid-template-columns:1fr;gap:12px}
      .page-title h1{font-size:29px;overflow-wrap:anywhere}
      .page-title>div:last-child{display:flex;gap:8px;flex-wrap:wrap}
      .page-title>div:last-child .button{flex:1 1 120px;min-height:44px}
      .eyebrow{font-size:10px}

      .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .kpi{padding:13px}
      .kpi .number{font-size:29px}
      .kpi .label{font-size:13px}
      .kpi .hint{font-size:11px}
      .queue-grid{grid-template-columns:1fr}

      .filter-grid,.form-grid{grid-template-columns:1fr}
      .filter-grid .span-2,.field.full{grid-column:auto}
      .date-row{grid-template-columns:1fr}
      input,select,textarea{font-size:16px;min-height:44px}
      textarea{min-height:120px}

      /* Turn collection tables into readable record cards on phones. */
      .table-wrap{border:0;background:transparent;overflow:visible}
      .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}
      .table-wrap thead{display:none}
      .table-wrap tbody{display:grid;gap:10px}
      .table-wrap tr{background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(25,25,22,.04)}
      .table-wrap td{display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;padding:9px 12px;border-bottom:1px solid #eee8df;align-items:start}
      .table-wrap td::before{content:attr(data-label);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
      .table-wrap td:first-child{display:block;padding:13px 12px;background:var(--cream)}
      .table-wrap td:first-child::before{display:none}
      .table-wrap td:last-child{border-bottom:0}
      .record-link{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.15}
      .pagination{justify-content:space-between;gap:6px}
      .pagination .button{min-height:44px}

      .detail-grid{grid-template-columns:1fr}
      .definition-grid{grid-template-columns:1fr}
      .definition-grid dt{padding-bottom:2px;border-bottom:0;color:var(--red-dark)}
      .definition-grid dd{padding-top:2px}
      .section-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
      .tab-button{white-space:nowrap;min-height:42px}
      .card-header{padding:14px}
      .card-body{padding:14px}

      .measurement-buttons{display:grid;grid-template-columns:1fr 1fr}
      .measurement-buttons .button{min-height:44px}
      .measurement-row{grid-template-columns:1fr 1fr 48px 40px}
      details.multi-picker summary{min-height:44px}

      /* Full-screen editor on phones. */
      .modal-backdrop{padding:0;display:block}
      .modal{width:100vw;height:100dvh;max-height:none;overflow:auto;box-shadow:none}
      .modal-header{position:sticky;top:0;z-index:3;padding:14px;background:var(--cream)}
      .modal-header h2{font-size:23px}
      .modal-body{padding:14px 14px 110px}
      .modal-footer{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -7px 20px rgba(0,0,0,.08)}
      .modal-footer .button{flex:1;min-height:46px}
      .toast{left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));text-align:center}
    }

    @media(max-width:430px){
      .header-tools{grid-template-columns:1fr}
      #newRecordButton{width:100%}
      .kpi-grid{grid-template-columns:1fr 1fr}
      .kpi .number{font-size:26px}
      .measurement-buttons{grid-template-columns:1fr}
      .measurement-row{grid-template-columns:1fr 90px 42px}
      .measurement-row strong{grid-column:1/-1}
      .table-wrap td{grid-template-columns:92px minmax(0,1fr)}
    }

    @media(max-width:950px){
      .masthead{align-items:flex-start;flex-wrap:wrap}
      .header-tools{width:100%;justify-content:stretch} .global-search{width:100%}
      .kpi-grid{grid-template-columns:repeat(2,1fr)} .detail-grid{grid-template-columns:1fr}
      .filter-grid{grid-template-columns:repeat(2,1fr)} .date-row{grid-template-columns:1fr}
    }
    @media(max-width:620px){
      .content{padding:22px 12px calc(70px + env(safe-area-inset-bottom))}
      .identity-title{font-size:19px} .museum-logo{width:42px;height:42px}
      .kpi-grid,.queue-grid,.filter-grid,.form-grid{grid-template-columns:1fr}
      .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .filter-grid .span-2,.field.full{grid-column:auto}
      .definition-grid{grid-template-columns:1fr}
    }
  
    .record-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .button.danger{border-color:#b92036;color:#9d1830;background:#fff}.button.danger:hover{background:#fff0f2}
    .button.warning{border-color:#a96f00;color:#745000;background:#fff8df}.button.warning:hover{background:#ffefb8}
    .status-banner{max-width:1320px;margin:0 auto 18px;padding:11px 14px;border-left:4px solid var(--red);background:#f5efe6}
    .status-banner.deleted{border-left-color:#6b6b6b;background:#ecebea}.status-banner.deaccessioned{border-left-color:#a96f00;background:#fff6d9}
    .lifecycle-deaccessioned{background:#fff0c6;color:#66520b}.lifecycle-deleted{background:#e9e7e4;color:#555}
    .danger-panel{background:#fff0f2;border-left:4px solid var(--red);padding:12px 14px;margin-bottom:15px}
    .entity-grid,.exhibit-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}
    .entity-card,.exhibit-card{border:1px solid var(--line);background:#fff;text-align:left;padding:16px;display:flex;flex-direction:column;gap:5px;min-height:150px}
    .entity-card:hover,.exhibit-card:hover{border-color:var(--red);box-shadow:var(--shadow)}
    .entity-title,.exhibit-title{font-family:Georgia,serif;font-size:22px;line-height:1.1;color:var(--ink)}
    .exhibit-count{font-family:Georgia,serif;font-size:34px;font-weight:700;color:var(--red)}
    .exhibit-item,.candidate-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border-bottom:1px solid #eee8df;padding:10px 0}
    .candidate-row{grid-template-columns:minmax(0,1fr) auto}
    @media(max-width:900px){.entity-grid,.exhibit-grid{grid-template-columns:repeat(2,minmax(180px,1fr))}}
    @media(max-width:620px){.entity-grid,.exhibit-grid{grid-template-columns:1fr}.record-actions{justify-content:flex-start;margin-top:12px}.exhibit-item,.candidate-row{grid-template-columns:1fr}.exhibit-item .button,.candidate-row .button{width:100%}}

    /* v0.3.2 media, account, carousel, and edit-history UI */
    .account-chip{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:10px;min-width:0}
    .account-copy{min-width:0;line-height:1.1}.account-email{font-size:11px;font-weight:800;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .account-role{font-size:10px;color:var(--muted);margin-top:2px}.account-switch{padding:6px 8px;font-size:11px;white-space:nowrap}
    .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .media-tile{border:1px solid var(--line);background:var(--cream-2);overflow:hidden;display:flex;flex-direction:column;min-height:180px}
    .media-thumb-wrap{aspect-ratio:4/3;background:#e9e4dc;overflow:hidden;display:grid;place-items:center}
    .media-thumb{width:100%;height:100%;object-fit:cover;display:block}
    .media-meta{padding:10px;display:grid;gap:4px}.media-meta strong{overflow-wrap:anywhere}
    .numismatic-card{margin-top:18px}
    .history-details{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
    .history-details summary{cursor:pointer;font-weight:800;color:var(--red-dark);padding:7px 0}
    .history-table{width:100%;font-size:12px;margin-top:8px}.history-table th,.history-table td{padding:7px 6px}
    .carousel-shell{margin:8px 0 30px;background:#151515;color:#fff;position:relative;overflow:hidden;min-height:300px;height:min(500px,52vw);max-height:500px}
    .carousel-stage{height:100%;position:relative}
    .carousel-slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none;border:0;padding:0;background:#151515;color:#fff;text-align:left;width:100%;height:100%}
    .carousel-slide.active{opacity:1;pointer-events:auto}
    .carousel-slide img{width:100%;height:100%;object-fit:cover;display:block}
    .carousel-overlay{position:absolute;inset:auto 0 0 0;padding:54px 24px 22px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff}
    .carousel-title{font-family:Georgia,serif;font-size:28px;line-height:1.05;margin:0 0 5px}
    .carousel-caption{font-size:13px;opacity:.9}
    .carousel-controls{position:absolute;right:16px;top:16px;display:flex;gap:7px;z-index:3}
    .carousel-controls button{width:42px;height:42px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.48);color:#fff;font-size:20px}
    .carousel-loading{height:100%;display:grid;place-items:center;color:#ddd}
    @media(max-width:1100px), (hover:none) and (pointer:coarse){
      .account-chip{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:8px 0 0;justify-content:space-between}
      .account-email{max-width:65vw}
      .media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .carousel-shell{height:360px;min-height:260px}
      .carousel-title{font-size:23px}
    }
    @media(max-width:520px){
      .media-grid{grid-template-columns:1fr}
      .carousel-shell{height:300px}
      .carousel-overlay{padding:44px 14px 14px}
    }


    /* Faceted search, authority, analysis, and setup UI */
    .facet-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
    .facet-panel{background:#fff;border:1px solid var(--line);padding:14px;position:sticky;top:145px;max-height:calc(100vh - 170px);overflow:auto}
    .facet-panel>.field{margin-bottom:12px}.date-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .facet-group{border-top:1px solid var(--line);padding:8px 0}.facet-group>summary{cursor:pointer;font-weight:800;font-size:13px}.facet-selected{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;margin-left:5px}
    .facet-options{display:grid;gap:5px;padding-top:8px}.facet-options label{display:flex;gap:7px;align-items:flex-start;font-size:13px}.facet-options input{width:auto;margin-top:3px}.facet-options em{font-style:normal;color:var(--muted);font-size:11px}.facet-more{margin-top:5px}.facet-more summary{cursor:pointer;color:var(--red-dark);font-size:12px;font-weight:700}
    .facet-actions{position:sticky;bottom:-14px;background:#fff;border-top:1px solid var(--line);padding:12px 0 2px;display:flex;gap:7px}.search-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.toolbar-actions{display:flex;gap:7px;align-items:center}.toolbar-actions select{width:auto}
    .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filter-chip{border:1px solid var(--line);background:var(--cream);padding:5px 8px;font-size:12px}.filter-chip.static{display:inline-block}
    .collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.collection-card{border:1px solid var(--line);background:#fff;padding:0;text-align:left;color:var(--ink);overflow:hidden}.collection-card-image{aspect-ratio:4/3;background:#e9e4dc;display:grid;place-items:center;overflow:hidden}.collection-card-image img{width:100%;height:100%;object-fit:cover}.collection-card-copy{display:grid;gap:3px;padding:11px}.collection-card-copy strong{font-family:Georgia,serif;font-size:18px}.collection-card-copy span,.collection-card-copy small{color:var(--muted)}
    .authority-subnav{margin-top:-6px}.inscription-text{font-family:Georgia,serif;font-size:18px;padding:7px 0}.history-section+.history-section{margin-top:18px}.history-section h3{font-family:Georgia,serif;font-weight:500;font-size:21px;margin:0 0 9px}
    @media(max-width:1100px), (hover:none) and (pointer:coarse){.facet-layout{grid-template-columns:1fr}.facet-panel{position:static;max-height:none}.search-toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%;flex-wrap:wrap}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.collection-grid{grid-template-columns:1fr}.date-mini{grid-template-columns:1fr}}

</style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <div class="identity">
        <div id="brandMark" class="brand-mark" aria-hidden="true">OM</div>
        <img id="institutionLogo" class="museum-logo app-hidden" alt="" src="">
        <div>
          <div id="identityTitle" class="identity-title">Your Museum</div>
          <div id="identitySubtitle" class="identity-subtitle">Open Museum CMS</div>
        </div>
      </div>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNav">☰ Menu</button>
      <div class="header-tools">
        <input id="globalSearch" class="global-search" type="search" placeholder="Search the collection…">
        <button id="newRecordButton" class="button primary">+ New record</button>
        <div class="account-chip" title="Current Google Workspace account">
          <div class="account-copy"><div id="currentUserEmail" class="account-email">Loading account…</div><div id="currentUserRole" class="account-role"></div></div>
          <button id="switchAccountButton" class="button account-switch" type="button" title="Open Google account chooser in a new tab">Switch account</button>
        </div>
      </div>
    </div>
    <nav class="main-nav" id="primaryNav" aria-label="Primary">
      <div class="nav-inner">
        <button class="nav-item active" data-view="dashboard">Overview</button>
        <button class="nav-item" data-view="advancedSearch">Advanced Search</button>
        <button class="nav-item" data-view="collection">Collection</button>
        <button class="nav-item" data-view="archives">Archives</button>
        <button class="nav-item" data-view="locations">Locations</button>
        <button class="nav-item" data-view="futureExhibits">Future Exhibit Planning</button>
        <button class="nav-item" data-view="authorities">Authorities</button>
        <button class="nav-item" data-view="needsReview">Needs Review</button>
        <button id="setupNav" class="nav-item" data-view="setup">Setup</button>
      </div>
    </nav>
  </header>

  <main id="content" class="content">
    <div class="loading-card">Loading Open Museum CMS…</div>
  </main>
  <footer class="app-footer">Open Museum CMS · Developed by Nigel Klemenčič-Puglisevich · GPL-3.0-or-later</footer>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
    const App={settings:{},user:null,enums:{},stats:{},view:'dashboard',params:{page:1,pageSize:50},locations:[],advancedParams:null,facetedParams:{page:1,pageSize:24,sort:'title_asc'},facetedView:'list',people:[],places:[],subjects:[],references:[],accessions:[],exhibitions:[],collectionMode:'all',archiveMode:'archives',futureExhibitMode:'permanent',authorityMode:'people',backStack:[],currentScreen:null,carouselTimer:null,appUrl:''};

    document.addEventListener('DOMContentLoaded',()=>{bindShell();initialise();});

    function gas(name,...args){
      return new Promise((resolve,reject)=>{
        const r=google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));
        r[name](...args);
      });
    }

    async function initialise(){
      try{
        const data=await gas('apiBootstrap');
        App.settings=data.settings||{};App.user=data.user;App.enums=data.enums||{};App.stats=data.stats||{};App.appUrl=data.appUrl||'';applyBranding(App.settings);
        document.getElementById('newRecordButton').classList.toggle('app-hidden',!data.user.permissions.includes('create'));
        document.getElementById('setupNav').classList.toggle('app-hidden',!data.user.permissions.includes('admin'));
        document.getElementById('currentUserEmail').textContent=data.user.email||'';
        document.getElementById('currentUserRole').textContent=data.user.role||'';
        navigate('dashboard');
      }catch(e){fatal(e)}
    }

    function applyBranding(s){
      s=s||{};
      if(s.primaryColour)document.documentElement.style.setProperty('--red',s.primaryColour);
      if(s.primaryDarkColour)document.documentElement.style.setProperty('--red-dark',s.primaryDarkColour);
      if(s.backgroundColour)document.documentElement.style.setProperty('--cream-2',s.backgroundColour);
      document.getElementById('identityTitle').textContent=s.institutionName||'Your Museum';
      document.getElementById('identitySubtitle').textContent=s.systemName||'Open Museum CMS';
      const logo=document.getElementById('institutionLogo'),mark=document.getElementById('brandMark');
      if(s.logoUrl){logo.src=s.logoUrl;logo.alt=(s.institutionName||'Institution')+' logo';logo.classList.remove('app-hidden');mark.classList.add('app-hidden');}
      else{logo.classList.add('app-hidden');mark.classList.remove('app-hidden');mark.textContent=(s.shortName||'OM').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'OM';}
    }

    function bindShell(){
      document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
      const navToggle=document.getElementById('navToggle');
      const primaryNav=document.getElementById('primaryNav');
      navToggle.onclick=()=>{
        const open=primaryNav.classList.toggle('open');
        navToggle.setAttribute('aria-expanded',String(open));
        navToggle.textContent=open?'✕ Close':'☰ Menu';
      };
      document.getElementById('newRecordButton').onclick=()=>recordForm({record:{},related:{measurements:[]}});
      document.getElementById('switchAccountButton').onclick=()=>{
        // Do not use window.location.href as the "continue" value here:
        // Apps Script HTML runs in a sandboxed googleusercontent frame and that
        // internal frame URL can produce Google's "400 malformed request" page.
        //
        // Instead, open Google's account chooser in a separate tab. After choosing
        // an account, return to this CMS tab and reload it. Google, not Apps Script,
        // ultimately controls which browser Google session is active.
        window.open('https://accounts.google.com/AccountChooser','_blank','noopener');
        toast('Choose the Google account in the new tab, then return here and reload the CMS.');
      };
      document.getElementById('globalSearch').addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          App.view='collection';App.params={page:1,pageSize:50,q:e.target.value.trim()};
          setNav('collection');renderRecordList('Collection');
        }
      });
    }

    function setNav(view){
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
    }

    function closeMobileNav(){
      const nav=document.getElementById('primaryNav');
      const toggle=document.getElementById('navToggle');
      if(nav)nav.classList.remove('open');
      if(toggle){toggle.setAttribute('aria-expanded','false');toggle.textContent='☰ Menu';}
    }

    function cloneState(obj){return JSON.parse(JSON.stringify(obj||{}))}
    function setCurrentScreen(screen){App.currentScreen=screen}
    function pushCurrentScreen(){
      if(App.currentScreen){
        App.backStack.push(cloneState(App.currentScreen));
        if(App.backStack.length>30)App.backStack.shift();
      }
    }
    function goBack(){
      const screen=App.backStack.pop();
      if(!screen)return navigate('dashboard');
      restoreScreen(screen);
    }
    function restoreScreen(s){
      if(!s)return navigate('dashboard');
      if(s.kind==='dashboard')return dashboard();
      if(s.kind==='collection')return collectionPage(s.mode||'all',s.params||null);
      if(s.kind==='archives')return archivesPage(s.mode||'archives',s.params||null);
      if(s.kind==='recordList'){App.view=s.view||'collection';App.params=s.params||{page:1,pageSize:50};setNav(App.view);return renderRecordList(s.title||'Collection',s.subtitle||'');}
      if(s.kind==='advanced'){App.facetedParams=s.params||{page:1,pageSize:24,sort:'title_asc'};return advancedSearch(true);}
      if(s.kind==='locations')return locations();
      if(s.kind==='authorities')return authoritiesPage(s.mode||'people');
      if(s.kind==='people')return authoritiesPage('people');
      if(s.kind==='place')return openPlace(s.id,false);
      if(s.kind==='subject')return openSubject(s.id,false);
      if(s.kind==='reference')return openReference(s.id,false);
      if(s.kind==='party')return openParty(s.id,false);
      if(s.kind==='accessions')return collectionPage('accessions');
      if(s.kind==='accession')return openAccession(s.id,false);
      if(s.kind==='futureExhibits')return futureExhibitsPage(s.mode||'permanent');
      if(s.kind==='exhibition')return openExhibition(s.id,false);
      if(s.kind==='record')return openRecord(s.id,false);
      if(s.kind==='setup')return setupPage();
      return navigate(s.view||'dashboard');
    }

    function navigate(view){
      App.view=view; setNav(view); closeMobileNav(); window.scrollTo({top:0,behavior:'smooth'});
      if(view==='dashboard')return dashboard();
      if(view==='advancedSearch')return advancedSearch(false);
      if(view==='collection')return collectionPage('all');
      if(view==='archives')return archivesPage('archives');
      if(view==='locations')return locations();
      if(view==='futureExhibits')return futureExhibitsPage('permanent');
      if(view==='authorities')return authoritiesPage('people');
      if(view==='needsReview'){
        App.params={catalogueStatus:'Imported – needs review',page:1,pageSize:50};
        return renderRecordList('Needs Review','Imported catalogue records awaiting review.');
      }
      if(view==='setup')return setupPage();
    }

    function dashboard(){
      const s=App.stats;
      html(`<div class="eyebrow">Collections database</div>
        <div class="page-title"><div><h1>Collection overview</h1><p>${esc(App.settings.institutionName||'Institution')} collections-management workspace.</p></div></div>
        ${App.user.permissions.includes('admin')&&String(App.settings.setupComplete||'No')!=='Yes'?`<div class="setup-banner"><strong>Finish setup:</strong> customise your institution name, users, storage folders, vocabularies, and analysis profiles. <button class="button small" id="finishSetup">Open Setup</button></div>`:''}
        <section id="overviewCarousel" class="carousel-shell" aria-label="Collection image highlights"><div class="carousel-loading">Loading collection images…</div></section>
        <div class="kpi-grid">
          ${kpi(s.total,'Catalogue records','Active collection records')}
          ${kpi(s.needsReview,'Needs review','Records awaiting review')}
          ${kpi(s.locationsUnchecked,'Location checks','Physical location not yet verified')}
          ${kpi(s.photography,'Photography queue','Images requiring attention')}
          ${kpi(s.archives,'Archival records','Archival units')}
          ${kpi(s.photographs,'Photographs','Photography collection')}
          ${kpi(s.highPriority,'High priority','Records flagged for attention')}
          ${kpi(s.deaccessioned||0,'Deaccessioned','Retained in institutional history')}
        </div>
        <div class="card"><div class="card-header"><h2>Work queues</h2></div><div class="card-body queue-grid">
          ${queue('Needs Review',s.needsReview,'needsReview')}
          ${queue('High Priority',s.highPriority,'highPriority')}
          ${queue('Photography',s.photography,'photoQueue')}
          ${queue('Unverified Locations',s.locationsUnchecked,'locationQueue')}
        </div></div>`);
      setCurrentScreen({kind:'dashboard'});if(document.getElementById('finishSetup'))document.getElementById('finishSetup').onclick=()=>navigate('setup');
      document.querySelectorAll('[data-queue]').forEach(b=>b.onclick=()=>openQueue(b.dataset.queue));
      loadOverviewCarousel();
    }

    function openQueue(q){
      if(q==='needsReview') return navigate('needsReview');
      if(q==='highPriority'){App.view='collection';setNav('collection');App.params={reviewPriority:'High',page:1,pageSize:50};return renderRecordList('High Priority');}
      if(q==='photoQueue'){App.view='archives';setNav('archives');App.params={photoQueue:true,page:1,pageSize:50};return renderRecordList('Photography Queue','Records requiring image migration or photography.');}
      if(q==='locationQueue'){App.view='collection';setNav('collection');App.params={page:1,pageSize:50,q:''};return renderRecordList('Location Verification','Use Advanced Search and record management to verify current locations.');}
    }

    function kpi(n,l,h){return `<div class="kpi"><div class="number">${esc(n)}</div><div class="label">${esc(l)}</div><div class="hint">${esc(h)}</div></div>`}
    function queue(t,n,q){return `<div class="queue-card"><h3>${esc(t)}</h3><div class="count">${esc(n)}</div><button class="button small" data-queue="${q}">Open</button></div>`}

    function collectionPage(mode='all',preservedParams=null){
      App.view='collection';App.collectionMode=mode;setNav('collection');closeMobileNav();
      const deletedAllowed=App.user&&App.user.permissions.includes('delete');
      const controls=`<div class="subnav">
        <button class="${mode==='all'?'active':''}" id="collectionAll">All Collection</button>
        <button class="${mode==='accessions'?'active':''}" id="collectionAccessions">Accessions</button>
        <button class="${mode==='deaccessioned'?'active':''}" id="collectionDeaccessioned">Deaccessioned</button>
        ${deletedAllowed?`<button class="${mode==='deleted'?'active':''}" id="collectionDeleted">Deleted</button>`:''}
      </div>`;

      if(mode==='accessions')return accessionsPage(controls);

      App.params=preservedParams || (
        mode==='deaccessioned' ? {lifecycleStatus:'Deaccessioned',page:1,pageSize:50}
        : mode==='deleted' ? {lifecycleStatus:'Deleted',page:1,pageSize:50}
        : {page:1,pageSize:50}
      );

      const title=mode==='deaccessioned'?'Deaccessioned Records':mode==='deleted'?'Deleted Records':'Collection';
      renderRecordList(title,'',controls,()=>bindCollectionSubnav(mode));
    }

    function bindCollectionSubnav(mode){
      if(document.getElementById('collectionAll'))document.getElementById('collectionAll').onclick=()=>collectionPage('all');
      if(document.getElementById('collectionAccessions'))document.getElementById('collectionAccessions').onclick=()=>collectionPage('accessions');
      if(document.getElementById('collectionDeaccessioned'))document.getElementById('collectionDeaccessioned').onclick=()=>collectionPage('deaccessioned');
      if(document.getElementById('collectionDeleted'))document.getElementById('collectionDeleted').onclick=()=>collectionPage('deleted');
    }

    function archivesPage(mode='archives',preservedParams=null){
      App.view='archives';App.archiveMode=mode;setNav('archives');
      App.params = preservedParams || (mode==='photos'
        ? {photographCollection:true,page:1,pageSize:50}
        : {recordType:'Archival Unit',page:1,pageSize:50});
      const controls=`<div class="subnav"><button class="${mode==='archives'?'active':''}" id="archiveRecords">Archival Records</button><button class="${mode==='photos'?'active':''}" id="archivePhotos">Photographs</button></div>`;
      renderRecordList(mode==='photos'?'Photographs':'Archives','',controls,()=>{
        document.getElementById('archiveRecords').onclick=()=>archivesPage('archives');
        document.getElementById('archivePhotos').onclick=()=>archivesPage('photos');
      });
    }

    async function renderRecordList(title,subtitle='',beforeTable='',afterRender=null){
      loading();
      try{
        const d=await gas('apiListRecords',App.params);
        html(`<div class="eyebrow">Browse</div>
          <div class="page-title"><div><h1>${esc(title)}</h1><p>${subtitle?esc(subtitle):d.total.toLocaleString()+' matching records.'}</p></div></div>
          ${beforeTable}
          <div class="filter-grid">
            <div class="field span-2"><label>Keyword search</label><input id="q" value="${attr(App.params.q||'')}" placeholder="Title, ID, description, donor, place…"></div>
            <div class="field"><label>Collection area</label>${selectHtml('area',App.enums.collectionArea,App.params.collectionArea,'All')}</div>
            <div class="field"><label>Catalogue status</label>${selectHtml('status',App.enums.catalogueStatus,App.params.catalogueStatus,'All')}</div>
          </div>
          <div style="margin-bottom:14px"><button id="apply" class="button">Apply filters</button></div>
          ${recordTable(d)}
          ${pagination(d)}`);

        document.querySelectorAll('[data-record]').forEach(x=>x.onclick=()=>openRecord(x.dataset.record));
        document.getElementById('apply').onclick=()=>{
          App.params={...App.params,q:document.getElementById('q').value.trim(),collectionArea:document.getElementById('area').value,catalogueStatus:document.getElementById('status').value,page:1};
          renderRecordList(title,subtitle,beforeTable,afterRender);
        };
        bindPagination(d,()=>renderRecordList(title,subtitle,beforeTable,afterRender));
        if(App.view==='collection')setCurrentScreen({kind:'collection',mode:App.collectionMode||'all',params:cloneState(App.params)});
        else if(App.view==='archives')setCurrentScreen({kind:'archives',mode:App.archiveMode||'archives',params:cloneState(App.params)});
        else setCurrentScreen({kind:'recordList',view:App.view,params:cloneState(App.params),title,subtitle});
        if(afterRender)afterRender();
      }catch(e){error(e)}
    }

    function advancedSearch(run){
      App.view='advancedSearch';setNav('advancedSearch');closeMobileNav();
      if(!run)App.facetedParams={page:1,pageSize:24,sort:'title_asc'};
      facetedSearch();
    }

    async function facetedSearch(){
      loading();
      try{
        const d=await gas('apiFacetedSearch',App.facetedParams);
        const p=App.facetedParams;
        html(`<div class="eyebrow">Research tools</div><div class="page-title"><div><h1>Advanced Search</h1><p>Faceted search across catalogue fields, authority relationships, display history, and collection management data.</p></div></div>
          <div class="facet-layout">
            <aside class="facet-panel">
              <div class="field"><label>Keywords</label><input id="facetQ" value="${attr(p.q||'')}" placeholder="Search descriptions, authorities, subjects, places…"></div>
              <div class="date-mini"><div class="field"><label>From year</label><input id="facetFrom" value="${attr(p.dateFromYear||'')}" placeholder="-200"></div><div class="field"><label>To year</label><input id="facetTo" value="${attr(p.dateToYear||'')}" placeholder="2026"></div></div>
              ${facetGroup('Collection area','collectionArea',d.facets.collectionArea,p.collectionArea)}
              ${facetGroup('Record type','recordType',d.facets.recordType,p.recordType)}
              ${facetGroup('Object type','objectType',d.facets.objectType,p.objectType,10)}
              ${facetGroup('Culture / community','culture',d.facets.culture,p.culture,8)}
              ${facetGroup('Period','period',d.facets.period,p.period,8)}
              ${facetGroup('School / style','schoolStyle',d.facets.schoolStyle,p.schoolStyle,8)}
              ${facetGroup('Analysis profile','analysisProfile',d.facets.analysisProfile,p.analysisProfile,10)}
              ${facetGroup('Classification','classification',d.facets.classification,p.classification,8)}
              ${facetGroup('Subjects','subjectId',d.facets.subjectId,p.subjectId,10)}
              ${facetGroup('Places','placeId',d.facets.placeId,p.placeId,10)}
              ${facetGroup('Place relationship','placeRole',d.facets.placeRole,p.placeRole)}
              ${facetGroup('People & organisations','partyId',d.facets.partyId,p.partyId,10)}
              ${facetGroup('Person / organisation role','roleType',d.facets.roleType,p.roleType,10)}
              ${facetGroup('Materials','material',d.facets.material,p.material,8)}
              ${facetGroup('Techniques','technique',d.facets.technique,p.technique,8)}
              ${facetGroup('Identification certainty','identificationCertainty',d.facets.identificationCertainty,p.identificationCertainty)}
              ${facetGroup('Display status','displayStatus',d.facets.displayStatus,p.displayStatus)}
              ${facetGroup('Accession status','accessionState',d.facets.accessionState,p.accessionState)}
              ${facetGroup('Images','hasImage',d.facets.hasImage,p.hasImage)}
              ${facetGroup('Exhibition','exhibitionId',d.facets.exhibitionId,p.exhibitionId,8)}
              ${facetGroup('Catalogue status','catalogueStatus',d.facets.catalogueStatus,p.catalogueStatus)}
              <div class="facet-actions"><button id="applyFacets" class="button primary">Apply filters</button><button id="clearFacets" class="button">Clear</button></div>
            </aside>
            <section class="facet-results">
              <div class="search-toolbar"><div><strong>${d.total.toLocaleString()}</strong> matching records</div><div class="toolbar-actions"><select id="facetSort"><option value="title_asc" ${p.sort==='title_asc'?'selected':''}>Title A–Z</option><option value="title_desc" ${p.sort==='title_desc'?'selected':''}>Title Z–A</option><option value="date_asc" ${p.sort==='date_asc'?'selected':''}>Date: earliest first</option><option value="date_desc" ${p.sort==='date_desc'?'selected':''}>Date: latest first</option><option value="record_id" ${p.sort==='record_id'?'selected':''}>Record ID</option></select><button id="listView" class="button small ${App.facetedView==='list'?'primary':''}">List</button><button id="gridView" class="button small ${App.facetedView==='grid'?'primary':''}">Grid</button></div></div>
              <div id="activeFacetChips" class="filter-chips">${activeFacetChips(p,d.facets)}</div>
              <div id="facetResultBody">${App.facetedView==='grid'?facetGrid(d):recordTable(d)}</div>
              ${pagination(d,'facet')}
            </section>
          </div>`);
        setCurrentScreen({kind:'advanced',params:cloneState(App.facetedParams)});
        bindFacetControls(d);
        if(App.facetedView==='grid')hydrateFacetGrid(d.rows);
      }catch(e){error(e)}
    }

    function facetGroup(title,key,items,selected,limit=6){
      selected=Array.isArray(selected)?selected:(selected?[selected]:[]);items=items||[];
      if(!items.length)return '';
      return `<details class="facet-group" ${selected.length?'open':''}><summary>${esc(title)}${selected.length?` <span class="facet-selected">${selected.length}</span>`:''}</summary><div class="facet-options">${items.slice(0,limit).map(x=>`<label><input type="checkbox" data-facet="${attr(key)}" value="${attr(x.value)}" ${selected.includes(String(x.value))?'checked':''}> <span>${esc(x.label)} <em>${x.count}</em></span></label>`).join('')}${items.length>limit?`<details class="facet-more"><summary>Show ${items.length-limit} more</summary>${items.slice(limit).map(x=>`<label><input type="checkbox" data-facet="${attr(key)}" value="${attr(x.value)}" ${selected.includes(String(x.value))?'checked':''}> <span>${esc(x.label)} <em>${x.count}</em></span></label>`).join('')}</details>`:''}</div></details>`;
    }

    function bindFacetControls(d){
      document.getElementById('applyFacets').onclick=()=>{
        const next={page:1,pageSize:24,sort:document.getElementById('facetSort').value,q:document.getElementById('facetQ').value.trim(),dateFromYear:document.getElementById('facetFrom').value.trim(),dateToYear:document.getElementById('facetTo').value.trim()};
        document.querySelectorAll('[data-facet]:checked').forEach(x=>{(next[x.dataset.facet]??=[]).push(x.value)});
        App.facetedParams=next;facetedSearch();
      };
      document.getElementById('clearFacets').onclick=()=>{App.facetedParams={page:1,pageSize:24,sort:'title_asc'};facetedSearch();};
      document.getElementById('facetSort').onchange=e=>{App.facetedParams.sort=e.target.value;App.facetedParams.page=1;facetedSearch();};
      document.getElementById('listView').onclick=()=>{App.facetedView='list';facetedSearch();};
      document.getElementById('gridView').onclick=()=>{App.facetedView='grid';facetedSearch();};
      const prev=document.getElementById('facetPrev'),next=document.getElementById('facetNext');if(prev)prev.onclick=()=>{App.facetedParams.page=Math.max(1,d.page-1);facetedSearch()};if(next)next.onclick=()=>{App.facetedParams.page=Math.min(d.pages,d.page+1);facetedSearch()};
      document.querySelectorAll('[data-record]').forEach(x=>x.onclick=()=>openRecord(x.dataset.record));
      document.querySelectorAll('[data-chip-key]').forEach(x=>x.onclick=()=>{const key=x.dataset.chipKey,val=x.dataset.chipValue;const arr=Array.isArray(App.facetedParams[key])?App.facetedParams[key]:[];App.facetedParams[key]=arr.filter(v=>String(v)!==String(val));App.facetedParams.page=1;facetedSearch();});
    }

    function activeFacetChips(p,facets){
      const labelFor=(key,value)=>{const item=(facets[key]||[]).find(x=>String(x.value)===String(value));return item?item.label:value};
      const chips=[];Object.keys(p).forEach(key=>{if(['page','pageSize','sort','q','dateFromYear','dateToYear'].includes(key))return;(Array.isArray(p[key])?p[key]:[]).forEach(v=>chips.push(`<button class="filter-chip" data-chip-key="${attr(key)}" data-chip-value="${attr(v)}">${esc(labelFor(key,v))} ×</button>`));});
      if(p.q)chips.push(`<span class="filter-chip static">Keyword: ${esc(p.q)}</span>`);if(p.dateFromYear||p.dateToYear)chips.push(`<span class="filter-chip static">Date: ${esc(p.dateFromYear||'…')}–${esc(p.dateToYear||'…')}</span>`);return chips.join('');
    }

    function facetGrid(d){return `<div class="collection-grid">${d.rows.length?d.rows.map(r=>`<button class="collection-card" data-record="${attr(r.RecordID)}"><div class="collection-card-image" ${r.PrimaryDriveFileID?`data-drive-thumb="${attr(r.PrimaryDriveFileID)}"`:''}>${r.PrimaryDriveFileID?'<span class="muted">Loading image…</span>':'<span class="muted">No image</span>'}</div><div class="collection-card-copy"><strong>${esc(r.PreferredTitle)}</strong><span>${esc(r.DateDisplay||'')}</span><span>${esc(r.CollectionArea||'')}</span><small>${esc(r.DisplayStatus||'')}</small></div></button>`).join(''):'<div class="empty">No matching records.</div>'}</div>`}
    async function hydrateFacetGrid(rows){const fake=(rows||[]).filter(r=>r.PrimaryDriveFileID).map(r=>({DriveFileID:r.PrimaryDriveFileID}));await hydrateDriveThumbnails(fake,document.getElementById('facetResultBody'));}

    function recordTable(d){
      return `<div class="table-wrap"><table><thead><tr><th>Record</th><th>Type</th><th>Collection</th><th>Date</th><th>Status</th><th>Location</th></tr></thead>
      <tbody>${d.rows.length?d.rows.map(recordRow).join(''):`<tr><td colspan="6" class="empty">No matching records.</td></tr>`}</tbody></table></div>`;
    }

    function recordRow(r){
      const cls=r.ReviewPriority==='High'?'high':r.CatalogueStatus==='Reviewed'?'good':'review';
      return `<tr><td data-label="Record"><button class="record-link" data-record="${attr(r.RecordID)}">${esc(r.PreferredTitle)}</button><div class="tiny muted">${esc(r.RecordID)}${r.MigrationID?' · '+esc(r.MigrationID):''}</div></td>
      <td data-label="Type">${esc(r.RecordType)}</td><td data-label="Collection">${esc(r.CollectionArea)}</td><td data-label="Date">${esc(r.DateDisplay)}</td><td data-label="Status"><span class="badge ${cls}">${esc(r.CatalogueStatus||'Unspecified')}</span></td><td data-label="Location">${esc(r.CurrentLocationName)}</td></tr>`;
    }

    function pagination(d,prefix=''){return `<div class="pagination"><button id="${prefix}Prev" class="button small" ${d.page<=1?'disabled':''}>Previous</button><span>Page ${d.page} of ${d.pages}</span><button id="${prefix}Next" class="button small" ${d.page>=d.pages?'disabled':''}>Next</button></div>`}
    function bindPagination(d,rerender){document.getElementById('Prev').onclick=()=>{App.params.page=Math.max(1,d.page-1);rerender();};document.getElementById('Next').onclick=()=>{App.params.page=Math.min(d.pages,d.page+1);rerender();};}

    async function openRecord(id,remember=true){
      if(remember)pushCurrentScreen();
      loading();
      try{
        const d=await gas('apiGetRecord',id),r=d.record;
        setCurrentScreen({kind:'record',id});
        const lifecycle=r.LifecycleStatus||((String(r.Active).toLowerCase()==='false')?'Deleted':'Active');
        const canEdit=App.user.permissions.includes('edit')&&lifecycle==='Active';
        const canMove=App.user.permissions.includes('move')&&lifecycle==='Active';
        const canAccessions=App.user.permissions.includes('accessions')&&lifecycle==='Active';
        const canDeaccession=App.user.permissions.includes('deaccession')&&lifecycle==='Active';
        const canDelete=App.user.permissions.includes('delete')&&lifecycle==='Active';
        const canRestore=App.user.permissions.includes('delete')&&lifecycle==='Deleted';

        const classification=splitTerms(r.Classifications).length?splitTerms(r.Classifications).join(', '):(r.ObjectClass||'');
        const materials=splitTerms(r.Materials).length?splitTerms(r.Materials).join(', '):'';
        const techniques=splitTerms(r.Techniques).length?splitTerms(r.Techniques).join(', '):'';
        const legacyMaterialsTechniques=(!materials&&!techniques)?(r.MaterialsTechniquesText||''):'';
        const measures=measurementDisplay(d.related.measurements,r.MeasurementsDisplay);
        const coin=(d.related.coin&&d.related.coin.length)?d.related.coin[0]:null;

        html(`${lifecycle!=='Active'?`<div class="status-banner ${lifecycle.toLowerCase()}"><strong>${esc(lifecycle)}</strong>${lifecycle==='Deleted'&&r.DeletionReason?' — '+esc(r.DeletionReason):''}</div>`:''}
          <div class="eyebrow">${esc(r.CollectionArea||'Collection record')}</div>
          <div class="page-title"><div><button class="button small" id="back">← Back</button><h1 style="margin-top:12px">${esc(r.PreferredTitle||'(Untitled record)')}</h1><p>${esc(r.RecordID||'')}${r.MigrationID?' · '+esc(r.MigrationID):''}</p></div>
          <div class="record-actions">${canEdit?'<button class="button" id="edit">Edit</button>':''} ${canMove?'<button class="button" id="move">Move</button>':''} ${canAccessions?'<button class="button" id="accessionAction">'+(r.AccessionID?'Edit accession':'Accession record')+'</button>':''} ${canDeaccession?'<button class="button warning" id="deaccession">Deaccession</button>':''} ${canDelete&&!r.AccessionID?'<button class="button danger" id="deleteRecord">Delete record</button>':''} ${canRestore?'<button class="button primary" id="restoreRecord">Restore record</button>':''}</div></div>
          <div class="detail-grid"><div>
            <div class="card"><div class="card-header"><h2>Object information</h2></div><div class="card-body"><dl class="definition-grid">
              ${def('Record type',r.RecordType)}${def('Object type',r.ObjectTypeGenreForm)}${def('Collection area',r.CollectionArea)}${def('Classifications',classification)}${def('Culture / community',r.CultureText)}${def('Period',r.PeriodText)}${def('School / style',r.SchoolStyleText)}
              ${def('Date / period',r.DateDisplay)}${def('Identification certainty',r.IdentificationCertainty)}${def('Maker / creator (legacy)',r.MakerCreatorText)}${def('Place of origin / creation (legacy)',r.PlaceOfOriginText)}
              ${def('Materials',materials)}${def('Techniques',techniques)}${def('Materials / techniques (legacy)',legacyMaterialsTechniques)}${def('Measurements',measures)}
            </dl></div></div>
            ${coin?`<div class="card numismatic-card"><div class="card-header"><h2>Numismatic details</h2></div><div class="card-body"><dl class="definition-grid">${def('Authority / ruler',coin.AuthorityRuler)}${def('Political entity',coin.PoliticalEntity)}${def('Coin date',coin.CoinDate)}${def('Mint',coin.Mint)}${def('Denomination',coin.Denomination)}${def('Material',coin.Material)}${def('Mass',coin.Mass_g?coin.Mass_g+' g':'')}${def('Diameter',coin.Diameter_mm?coin.Diameter_mm+' mm':'')}${def('Obverse',coin.ObverseDescription)}${def('Reverse',coin.ReverseDescription)}</dl></div></div>`:''}
            ${textCard('Description',r.Description)}${textCard('Curatorial / research comments',r.CuratorialComments)}${textCard('Provenance / custodial history',r.ProvenanceCustodialHistory)}${textCard('Notes',r.Notes)}
          </div><div>
            <div class="card"><div class="card-header"><h2>Management</h2></div><div class="card-body"><dl class="definition-grid">
              ${def('Lifecycle',lifecycle)}${def('Accession',d.accession?(d.accession.AccessionNumber||d.accession.AccessionID):(r.AccessionID||'Not accessioned'))}
              ${def('Catalogue status',r.CatalogueStatus)}${def('Review priority',r.ReviewPriority)}${def('Photo status',r.PhotoStatus)}
              ${def('Current location',d.currentLocation?d.currentLocation.LocationName:(r.LegacyLocationText||'Not assigned'))}
              ${def('Location checked',r.LocationCheckedStatus)}${def('Documentation',r.DocumentationStatus)}${def('Public access',r.PublicAccessStatus)}${def('Display status',r.DisplayStatus||'Not on display')}${def('Current display',d.displayExhibition?(d.displayExhibition.ExhibitionTitle+(r.CurrentDisplayLocation?' — '+r.CurrentDisplayLocation:'')):r.CurrentDisplayLocation)}
              ${def('Catalogued by',r.CataloguedBy||'Not yet recorded')}${def('Credit line',r.CreditLine)}${def('Legacy cataloguer dates',r.LegacyCataloguerDates)}
            </dl>
            <details class="history-details" id="editHistoryDetails"><summary>Full edit history</summary><div id="editHistoryBody" class="muted">Open to load edit history.</div></details>
            </div></div>
          </div></div>
          <div class="section-tabs">
            ${tab('media',d.related.media.length,true)}${tab('analysis',null)}${tab('authorities',null)}${tab('places',null)}${tab('subjects',null)}${tab('inscriptions',null)}${tab('references',null)}${tab('archive',null)}
            ${tab('movements',null)}${tab('reviews',null)}${tab('exhibitions',null)}${tab('deaccessions',null)}${tab('migration',null)}
          </div><div id="related"></div>`);

        document.getElementById('back').onclick=goBack;
        document.getElementById('editHistoryDetails').ontoggle=async e=>{
          if(!e.target.open||e.target.dataset.loaded==='1')return;
          const target=document.getElementById('editHistoryBody');target.textContent='Loading…';
          try{
            const rows=await gas('apiGetRecordEditHistory',r.RecordID);
            target.innerHTML=editHistoryTable(rows);
            e.target.dataset.loaded='1';
          }catch(err){target.innerHTML=`<span class="error-card">${esc(err.message)}</span>`}
        };
        if(document.getElementById('edit'))document.getElementById('edit').onclick=()=>recordForm(d);
        if(document.getElementById('move'))document.getElementById('move').onclick=()=>moveForm(r);
        if(document.getElementById('accessionAction'))document.getElementById('accessionAction').onclick=()=>recordAccessionForm(d);
        if(document.getElementById('deaccession'))document.getElementById('deaccession').onclick=()=>deaccessionForm(d);
        if(document.getElementById('deleteRecord'))document.getElementById('deleteRecord').onclick=()=>deleteRecordForm(d);
        if(document.getElementById('restoreRecord'))document.getElementById('restoreRecord').onclick=async()=>{if(confirm('Restore this record to the active collection?')){try{const out=await gas('apiRestoreDeletedRecord',r.RecordID);toast('Record restored.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}};
        document.querySelectorAll('.tab-button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-button').forEach(x=>x.classList.remove('active'));b.classList.add('active');related(b.dataset.section,d);});
        related('media',d);
      }catch(e){error(e)}
    }

    function tab(s,n,a=false){
      const count=(typeof n==='number')?` (${n})`:'';
      const labels={analysis:'Analysis'};
      const label=labels[s]||(s.charAt(0).toUpperCase()+s.slice(1));
      return `<button class="tab-button ${a?'active':''}" data-section="${s}">${label}${count}</button>`;
    }

    async function related(section,d){
      let rows=d.related[section];
      let action='';
      if(section==='media'&&App.user.permissions.includes('media'))action='<button id="addMedia" class="button small">+ Add media</button>';
      if(section==='reviews'&&App.user.permissions.includes('review'))action='<button id="addReview" class="button small">+ Add review</button>';
      if(section==='authorities'&&App.user.permissions.includes('authorities'))action='<button id="linkAuthority" class="button small">+ Link person / organisation</button>';
      if(section==='places'&&App.user.permissions.includes('authorities'))action='<button id="linkPlace" class="button small">+ Link place</button>';
      if(section==='subjects'&&App.user.permissions.includes('authorities'))action='<button id="linkSubject" class="button small">+ Add subject</button>';
      if(section==='inscriptions'&&App.user.permissions.includes('edit'))action='<button id="addInscription" class="button small">+ Add inscription / mark</button>';
      if(section==='references'&&App.user.permissions.includes('edit'))action='<button id="linkReference" class="button small">+ Add reference</button>';

      const sectionLabels={analysis:'Analysis'};
      const sectionLabel=sectionLabels[section]||(section.charAt(0).toUpperCase()+section.slice(1));
      document.getElementById('related').innerHTML=`<div class="card"><div class="card-header"><h2>${esc(sectionLabel)}</h2>${action}</div><div id="relatedBody" class="card-body related-list">${rows===undefined?'<div class="empty">Loading…</div>':''}</div></div>`;

      if(rows===undefined){
        try{
          rows=await gas('apiGetRecordRelated',d.record.RecordID,section);
          d.related[section]=rows;
        }catch(err){
          document.getElementById('relatedBody').innerHTML=`<div class="error-card">${esc(err.message)}</div>`;
          return;
        }
      }

      if(section==='media'){
        document.getElementById('relatedBody').innerHTML=mediaGrid(rows);
        hydrateDriveThumbnails(rows,document.getElementById('relatedBody'));
      }else if(section==='analysis'){
        document.getElementById('relatedBody').innerHTML=analysisProfilesHtml(rows);
        bindAnalysisControls(d.record,rows);
      }else if(section==='exhibitions'){
        document.getElementById('relatedBody').innerHTML=exhibitionHistoryHtml(rows);
      }else{
        document.getElementById('relatedBody').innerHTML=rows.length?rows.map(x=>relatedItem(section,x)).join(''):'<div class="empty">No related records.</div>';
      }

      if(document.getElementById('addReview'))document.getElementById('addReview').onclick=()=>reviewForm(d.record);
      if(document.getElementById('addMedia'))document.getElementById('addMedia').onclick=()=>mediaForm(d.record);
      if(document.getElementById('linkAuthority'))document.getElementById('linkAuthority').onclick=()=>linkAuthorityForm(d.record);
      if(document.getElementById('linkPlace'))document.getElementById('linkPlace').onclick=()=>linkPlaceForm(d.record);
      if(document.getElementById('linkSubject'))document.getElementById('linkSubject').onclick=()=>linkSubjectForm(d.record);
      if(document.getElementById('addInscription'))document.getElementById('addInscription').onclick=()=>inscriptionForm(d.record);
      if(document.getElementById('linkReference'))document.getElementById('linkReference').onclick=()=>linkReferenceForm(d.record);
      document.querySelectorAll('[data-unlink-role]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this authority relationship?')){try{const out=await gas('apiRemoveRecordRole',b.dataset.unlinkRole);toast('Authority link removed.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}});
      document.querySelectorAll('[data-unlink-place]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this place relationship?')){try{const out=await gas('apiRemoveRecordPlace',b.dataset.unlinkPlace);toast('Place link removed.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}});
      document.querySelectorAll('[data-unlink-subject]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this subject?')){try{const out=await gas('apiRemoveRecordSubject',b.dataset.unlinkSubject);toast('Subject removed.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}});
      document.querySelectorAll('[data-edit-inscription]').forEach(b=>b.onclick=()=>inscriptionForm(d.record,rows.find(x=>String(x.InscriptionID)===String(b.dataset.editInscription))));
      document.querySelectorAll('[data-delete-inscription]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this inscription / mark entry?')){try{const out=await gas('apiDeleteInscription',b.dataset.deleteInscription);toast('Inscription removed.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}});
      document.querySelectorAll('[data-unlink-reference]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this reference link?')){try{const out=await gas('apiRemoveRecordReference',b.dataset.unlinkReference);toast('Reference removed.');openRecord(out.record.RecordID,false);}catch(e){toast(e.message,true)}}});
    }

    function exhibitionHistoryHtml(rows){
      if(!rows||!rows.length)return '<div class="empty">No exhibition history or planning assignments.</div>';
      const current=rows.filter(x=>x.InstalledDate&&!x.DeinstalledDate&&String(x.Exhibition?.ExhibitionStatus||x.Exhibition?.PlanningStatus||'')==='Installed');
      const history=rows.filter(x=>x.InstalledDate||['Closed','Archived'].includes(String(x.Exhibition?.ExhibitionStatus||'')));
      const planning=rows.filter(x=>!history.includes(x)&&!current.includes(x));
      const section=(title,items)=>items.length?`<div class="history-section"><h3>${esc(title)}</h3>${items.map(x=>`<div class="related-item"><strong>${esc(x.Exhibition?x.Exhibition.ExhibitionTitle:x.ExhibitionID)}</strong><div>${esc(x.DisplayLocation||x.Exhibition?.Venue||'')} · ${esc(x.SelectionStatus||'')}</div><div class="muted">${esc([x.Exhibition?.StartDate,x.Exhibition?.EndDate].filter(Boolean).join('–'))}${x.InstalledDate?' · installed '+esc(x.InstalledDate):''}${x.DeinstalledDate?' · deinstalled '+esc(x.DeinstalledDate):''}</div></div>`).join('')}</div>`:'';
      return section('Currently on display',current)+section('Exhibition history',history.filter(x=>!current.includes(x)))+section('Future / planning assignments',planning);
    }

    function mediaGrid(rows){
      if(!rows||!rows.length)return '<div class="empty">No related media.</div>';
      return `<div class="media-grid">${rows.map(x=>{
        const isImage=!!x.DriveFileID && (
          String(x.MediaType||'').toLowerCase().includes('photo') ||
          String(x.MediaType||'').toLowerCase().includes('image') ||
          /\.(jpe?g|png|webp|gif)$/i.test(String(x.FileName||''))
        );
        return `<article class="media-tile">
          <div class="media-thumb-wrap" ${isImage?`data-drive-thumb="${attr(x.DriveFileID)}"`:''}>
            ${isImage?'<span class="muted">Loading image…</span>':'<span class="muted">Document / file</span>'}
          </div>
          <div class="media-meta"><strong>${esc(x.FileName||x.MediaType||'Media')}</strong>${x.ViewDescription?`<span>${esc(x.ViewDescription)}</span>`:''}${x.DriveURL?`<a href="${attr(x.DriveURL)}" target="_blank" rel="noopener">Open in Drive</a>`:''}</div>
        </article>`;
      }).join('')}</div>`;
    }

    async function hydrateDriveThumbnails(rows,scope=document){
      const ids=[...new Set((rows||[]).map(x=>String(x.DriveFileID||'')).filter(Boolean))];
      if(!ids.length)return;
      try{
        const thumbs=await gas('apiGetMediaThumbnails',ids);
        ids.forEach(id=>{
          scope.querySelectorAll(`[data-drive-thumb="${cssEscape(id)}"]`).forEach(host=>{
            const src=thumbs[id]||'';
            if(!src){
              host.innerHTML='<span class="muted">Image preview unavailable</span>';
              return;
            }
            const img=document.createElement('img');
            img.className='media-thumb';
            img.loading='lazy';
            img.alt='Collection image';
            img.src=src;
            img.onerror=()=>{host.innerHTML='<span class="muted">Image preview unavailable</span>'};
            host.innerHTML='';
            host.appendChild(img);
          });
        });
      }catch(e){
        scope.querySelectorAll('[data-drive-thumb]').forEach(host=>{
          host.innerHTML='<span class="muted">Image preview unavailable</span>';
        });
      }
    }

    function cssEscape(value){
      if(window.CSS&&CSS.escape)return CSS.escape(String(value));
      return String(value).replace(/["\\]/g,'\\$&');
    }

    function relatedItem(s,x){
      if(s==='authorities')return `<div class="related-item"><strong>${esc(x.Party?x.Party.PreferredName:(x.PartyID||'Authority'))}</strong><div>${esc(x.RoleType||'Associated')} ${x.AttributionStatus?'· '+esc(x.AttributionStatus):''}</div><div class="muted">${esc(x.RoleNote||x.Notes||'')}</div>${App.user.permissions.includes('authorities')?`<button class="button small danger" data-unlink-role="${attr(x.RecordRoleID)}">Remove link</button>`:''}</div>`;
      if(s==='places')return `<div class="related-item"><strong>${esc(x.Place?x.Place.PreferredName:(x.PlaceID||'Place'))}</strong><div>${esc(x.PlaceRole||'Associated with')} · ${esc(x.Certainty||'')}</div><div class="muted">${esc(x.Notes||'')}</div>${App.user.permissions.includes('authorities')?`<button class="button small danger" data-unlink-place="${attr(x.RecordPlaceID)}">Remove link</button>`:''}</div>`;
      if(s==='subjects')return `<div class="related-item"><strong>${esc(x.Subject?x.Subject.PreferredTerm:(x.SubjectID||'Subject'))}</strong><div>${esc(x.Certainty||'')}</div><div class="muted">${esc(x.Notes||'')}</div>${App.user.permissions.includes('authorities')?`<button class="button small danger" data-unlink-subject="${attr(x.RecordSubjectID)}">Remove</button>`:''}</div>`;
      if(s==='inscriptions')return `<div class="related-item"><strong>${esc(x.InscriptionType||'Inscription / mark')}</strong> ${x.Position?'· '+esc(x.Position):''}<div class="inscription-text">${esc(x.InscriptionText||'')}</div>${x.Translation?`<div><em>Translation:</em> ${esc(x.Translation)}</div>`:''}<div class="muted">${esc([x.Language,x.Script,x.Certainty,x.Notes].filter(Boolean).join(' · '))}</div>${App.user.permissions.includes('edit')?`<button class="button small" data-edit-inscription="${attr(x.InscriptionID)}">Edit</button> <button class="button small danger" data-delete-inscription="${attr(x.InscriptionID)}">Delete</button>`:''}</div>`;
      if(s==='references')return `<div class="related-item"><strong>${esc(x.Reference?x.Reference.Citation||x.Reference.Title:(x.ReferenceID||'Reference'))}</strong><div>${esc(x.ReferenceRole||'General reference')} ${x.PageFigure?'· '+esc(x.PageFigure):''}</div>${x.Reference&&x.Reference.URLDOI?`<a href="${attr(x.Reference.URLDOI)}" target="_blank" rel="noopener">Open reference</a>`:''}<div class="muted">${esc(x.Notes||'')}</div>${App.user.permissions.includes('edit')?`<button class="button small danger" data-unlink-reference="${attr(x.RecordReferenceID)}">Remove link</button>`:''}</div>`;

    function editHistoryTable(rows){
      if(!rows||!rows.length)return '<div class="empty">No web-app edit history has been recorded yet.</div>';

    function parseCmsDateTime(value){
      const d=new Date(value);
      if(isNaN(d))return {date:String(value||''),time:''};
      return {
        date:d.toLocaleDateString('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}),
        time:d.toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'})
      };
    }

          </div>

          ${(r.MakerCreatorText||r.PlaceOfOriginText)?`<div class="field full"><div class="legacy-note"><strong>Legacy relationship data retained:</strong>${r.MakerCreatorText?` Maker / creator: ${esc(r.MakerCreatorText)}.`:''}${r.PlaceOfOriginText?` Place: ${esc(r.PlaceOfOriginText)}.`:''} Use the People & Organisations and Places tabs on the record page to create structured relationships.</div></div>`:''}

          <div class="field full">${multiPicker('Materials','Materials',App.enums.material,splitTerms(r.Materials),'Material')}</div>

          <div class="field full">
            <label>Measurements</label>
            ${measurementEditor(data.related&&data.related.measurements?data.related.measurements:[],r.MeasurementsDisplay||'')}
          </div>

          ${field(['Description','Description','textarea'],r.Description||'')}
          ${field(['CuratorialComments','Curatorial / research comments','textarea'],r.CuratorialComments||'')}
          ${field(['ProvenanceCustodialHistory','Provenance / custodial history','textarea'],r.ProvenanceCustodialHistory||'')}
          ${field(['DocumentationStatus','Documentation status','select',App.enums.documentationStatus],r.DocumentationStatus||'')}
          ${field(['PhotoStatus','Photo status','select',App.enums.photoStatus],r.PhotoStatus||'')}
          ${field(['ReviewPriority','Review priority','select',App.enums.reviewPriority],r.ReviewPriority||'')}
          ${field(['PublicAccessStatus','Public access','select',App.enums.publicAccessStatus],r.PublicAccessStatus||'')}
          ${field(['Notes','Notes','textarea'],r.Notes||'')}
          ${!isNew?'<div class="field full"><label for="f_EditReason">Reason for Edit <span style="color:var(--red)">*</span></label><textarea id="f_EditReason" placeholder="Briefly explain what was changed and why. This becomes the Comment in the edit history." required></textarea><small>Required for every edit made through the web app.</small></div>':''}
        </div>`,
        `<button class="button" data-close>Cancel</button><button class="button primary" id="saveRecord">${isNew?'Create record':'Save changes'}</button>`);

      bindDateUI();
      bindMultiPickers();
      bindMeasurementButtons();


      document.getElementById('saveRecord').onclick=async()=>{
        try{
          busy(true);
          const payload={
            PreferredTitle:val('PreferredTitle'),RecordType:val('RecordType'),CatalogueStatus:val('CatalogueStatus'),CollectionArea:val('CollectionArea'),
            ObjectTypeGenreForm:val('ObjectTypeGenreForm'),CultureText:val('CultureText'),PeriodText:val('PeriodText'),SchoolStyleText:val('SchoolStyleText'),CreditLine:val('CreditLine'),IdentificationCertainty:val('IdentificationCertainty'),Classifications:getMulti('Classifications'),
            Materials:getMulti('Materials'),Techniques:getMulti('Techniques'),
            Description:val('Description'),CuratorialComments:val('CuratorialComments'),ProvenanceCustodialHistory:val('ProvenanceCustodialHistory'),
            DocumentationStatus:val('DocumentationStatus'),PhotoStatus:val('PhotoStatus'),ReviewPriority:val('ReviewPriority'),
            PublicAccessStatus:val('PublicAccessStatus'),Notes:val('Notes')
          };

          const dateStart=document.getElementById('f_DateStart').value.trim();
          const dateQualifier=document.getElementById('f_DateQualifier').value;
          const dateEnd=document.getElementById('f_DateEnd').value.trim();
          if(dateStart || hasStructuredDate || !r.DateDisplay){
            payload.DateQualifier=dateQualifier;
            payload.DateStart=dateStart;
            payload.DateEnd=dateEnd;
          }

          const measurements=getMeasurements();
          const editReason=isNew?'':document.getElementById('f_EditReason').value.trim();
          if(!isNew&&!editReason)throw new Error('Reason for Edit is required.');
          const result=isNew
            ? await gas('apiCreateRecord',payload,measurements)
            : await gas('apiSaveRecord',r.RecordID,payload,measurements,editReason);

          closeModal();toast(isNew?'Record created.':'Record saved.');openRecord(result.record.RecordID,false);
        }catch(e){toast(e.message,true);busy(false)}
      };
